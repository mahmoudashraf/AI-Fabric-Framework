connector:
  inbound-auth:
    allow-unauthenticated: false
    api-key:
      enabled: true
      header: ${CONNECTOR_API_KEY_HEADER:X-AIFABRIC-API-KEY}
      value: ${CONNECTOR_API_KEY}
  upstream:
    base-url: https://loomai-dealership-demo-api.46.224.145.148.sslip.io
    auth:
      type: API_KEY
      header: X-DEALERSHIP-INTERNAL-KEY
      value: ${MANAGED_DEALERSHIP_DEMO_INTERNAL_API_KEY}
  http:
    connect-timeout-ms: 2000
    timeout-ms: 8000
    retry:
      enabled: true
      max-attempts: 2
      backoff-ms: 250
      retry-on: [429, 502, 503, 504]
  idempotency:
    enabled: true
    ttl-seconds: 86400
    in-progress-max-wait-ms: 2000

authz:
  enabled: true
  path: /api/internal/authz/check
  upstream:
    base-url: https://loomai-dealership-demo-api.46.224.145.148.sslip.io
    auth:
      type: API_KEY
      header: X-DEALERSHIP-INTERNAL-KEY
      value: ${MANAGED_DEALERSHIP_DEMO_INTERNAL_API_KEY}
  http:
    connect-timeout-ms: 500
    timeout-ms: 1500

actions:
  dealership_search_inventory:
    source-projection:
      source-ref: autotrader-dealership-stock-source
      filters:
        - param: make
          fields: [make]
          operator: EQUALS_IGNORE_CASE
        - param: fuelType
          fields: [fuelType]
          operator: EQUALS_IGNORE_CASE
        - param: bodyType
          fields: [bodyType]
          operator: EQUALS_IGNORE_CASE
        - param: maxPriceGbp
          fields: [priceGbp]
          operator: NUMBER_LESS_THAN_OR_EQUAL
        - param: maxMileage
          fields: [mileage]
          operator: NUMBER_LESS_THAN_OR_EQUAL
      output-fields:
        - stockId
        - make
        - model
        - derivative
        - year
        - priceGbp
        - mileage
        - fuelType
        - transmission
        - bodyType
        - availability
        - advertStatus
        - features
        - imageId
        - imageUrl
      limit-param: limit
      default-limit: 10
      max-limit: 24
      require-successful-sync: true
      max-staleness-seconds: 1800
    response:
      result:
        _items: "{{body.results}}"
        _count: "{{body.returnedCount}}"
        _totalCount: "{{body.totalResults}}"
        results: "{{body.results}}"
        total: "{{body.totalResults}}"
        appliedFilters: "{{body.appliedFilters}}"
        source: "{{body.source}}"
        dataNotice: Synthetic demonstration records returned through the documented Auto Trader Stock API response shape.
      pinned-targets-from-collection:
        collection-json-pointer: /results
        id-json-pointer: /stockId
        vector-space: dealer-vehicle
        content-fields:
          make: /make
          model: /model
          derivative: /derivative
          year: /year
          priceGbp: /priceGbp
          mileage: /mileage
          fuelType: /fuelType
          transmission: /transmission
          bodyType: /bodyType
          availability: /availability
        metadata-fields:
          stockId: /stockId
          make: /make
          model: /model
          year: /year
          imageUrl: /imageUrl
        max-targets: 8
        max-content-chars: 1200
      message: Provider stock search completed.
    authz:
      enabled: true
      resource-id: inventory-search
      operation-type: SEARCH

  dealership_get_vehicle:
    source-projection:
      source-ref: autotrader-dealership-stock-source
      filters:
        - param: vehicle
          fields: [stockId]
          operator: EQUALS_IGNORE_CASE
      output-fields:
        - stockId
        - make
        - model
        - derivative
        - year
        - priceGbp
        - mileage
        - fuelType
        - transmission
        - bodyType
        - availability
        - advertStatus
        - features
        - imageId
        - imageUrl
      default-limit: 1
      max-limit: 1
      require-successful-sync: true
      max-staleness-seconds: 1800
    response:
      result:
        _items: "{{body.results}}"
        _count: "{{body.returnedCount}}"
        _totalCount: "{{body.totalResults}}"
        vehicleRecord: "{{body.results[0]}}"
        total: "{{body.totalResults}}"
        source: "{{body.source}}"
        dataNotice: Synthetic demonstration record returned through the documented Auto Trader Stock API response shape.
      pinned-targets-from-collection:
        collection-json-pointer: /results
        id-json-pointer: /stockId
        vector-space: dealer-vehicle
        content-fields:
          make: /make
          model: /model
          derivative: /derivative
          year: /year
          priceGbp: /priceGbp
          mileage: /mileage
          fuelType: /fuelType
          transmission: /transmission
          bodyType: /bodyType
          availability: /availability
          features: /features
        metadata-fields:
          stockId: /stockId
          make: /make
          model: /model
          year: /year
          imageUrl: /imageUrl
        max-targets: 1
        max-content-chars: 1600
      message: Current provider stock details loaded.
    authz:
      enabled: true
      resource-id: "{{params.vehicle}}"
      operation-type: READ

  dealership_compare_vehicles:
    method: GET
    path: /api/public/vehicles/compare
    request:
      query:
        dealershipId: dealer-demo-001
        references: "{{params.vehicleReferences}}"
    response:
      success-http-status: [200]
      result:
        _items: "{{body.vehicles}}"
        _count: "{{body.count}}"
        source: "{{body.source}}"
      message: Current vehicles compared.
    authz:
      enabled: true
      resource-id: inventory-search
      operation-type: READ

  dealership_request_callback:
    method: POST
    path: /api/internal/actions/execute
    idempotency-header: Idempotency-Key
    request:
      body:
        actionId: "{{actionId}}"
        idempotencyKey: "{{idempotencyKey}}"
        params:
          confirmationAccepted: true
          vehicleReference: "{{params.vehicle}}"
          name: "{{params.name}}"
          email: "{{params.email}}"
          phone: "{{params.phone}}"
          message: "{{params.message}}"
          consent: "{{params.consent}}"
        trace:
          requestId: "{{trace.requestId}}"
          conversationId: "{{trace.conversationId}}"
          authContext: "{{trace.authContext}}"
    response:
      success-http-status: [200]
      message: Callback request created.
    authz:
      enabled: true
      resource-id: "{{params.vehicle}}"
      operation-type: REQUEST_CALLBACK

  dealership_request_test_drive:
    method: POST
    path: /api/internal/actions/execute
    idempotency-header: Idempotency-Key
    request:
      body:
        actionId: "{{actionId}}"
        idempotencyKey: "{{idempotencyKey}}"
        params:
          confirmationAccepted: true
          vehicleReference: "{{params.vehicle}}"
          name: "{{params.name}}"
          email: "{{params.email}}"
          phone: "{{params.phone}}"
          preferredDate: "{{params.preferredDate}}"
          message: "{{params.message}}"
        trace:
          requestId: "{{trace.requestId}}"
          conversationId: "{{trace.conversationId}}"
          authContext: "{{trace.authContext}}"
    response:
      success-http-status: [200]
      message: Test-drive request created.
    authz:
      enabled: true
      resource-id: "{{params.vehicle}}"
      operation-type: REQUEST_TEST_DRIVE
