connector:
  inbound-auth:
    allow-unauthenticated: false
    api-key:
      enabled: true
      header: ${CONNECTOR_API_KEY_HEADER:X-AIFABRIC-API-KEY}
      value: ${CONNECTOR_API_KEY}
  upstream:
    base-url: https://loomai-dealership-demo-api.46.224.145.148.sslip.io
    auth:
      type: API_KEY
      header: X-DEALERSHIP-INTERNAL-KEY
      value: ${MANAGED_DEALERSHIP_DEMO_INTERNAL_API_KEY}
  http:
    connect-timeout-ms: 2000
    timeout-ms: 8000
    retry:
      enabled: true
      max-attempts: 2
      backoff-ms: 250
      retry-on: [429, 502, 503, 504]
  idempotency:
    enabled: true
    ttl-seconds: 86400
    in-progress-max-wait-ms: 2000

authz:
  enabled: true
  path: /api/internal/authz/check
  upstream:
    base-url: https://loomai-dealership-demo-api.46.224.145.148.sslip.io
    auth:
      type: API_KEY
      header: X-DEALERSHIP-INTERNAL-KEY
      value: ${MANAGED_DEALERSHIP_DEMO_INTERNAL_API_KEY}
  http:
    connect-timeout-ms: 500
    timeout-ms: 1500

actions:
  dealership_search_inventory:
    method: GET
    path: /api/public/vehicles
    request:
      query:
        dealershipId: dealer-demo-001
        make: "{{params.make}}"
        fuelType: "{{params.fuelType}}"
        bodyType: "{{params.bodyType}}"
        maxPriceGbp: "{{params.maxPriceGbp}}"
        maxMileage: "{{params.maxMileage}}"
        limit: "{{params.limit|12}}"
    response:
      success-http-status: [200]
      result: "{{body.items}}"
      message: Inventory search completed.
    authz:
      enabled: true
      resource-id: inventory-search
      operation-type: SEARCH

  dealership_get_vehicle:
    method: GET
    path: /api/public/vehicles/{{params.slug}}
    response:
      success-http-status: [200]
      message: Current vehicle details loaded.
    authz:
      enabled: true
      resource-id: "{{params.vehicleId}}"
      operation-type: READ

  dealership_resolve_vehicle:
    method: GET
    path: /api/public/vehicles/resolve
    request:
      query:
        dealershipId: dealer-demo-001
        reference: "{{params.reference}}"
    response:
      success-http-status: [200]
      message: "{{body.message}}"
    authz:
      enabled: true
      resource-id: inventory-search
      operation-type: READ

  dealership_compare_vehicles:
    method: GET
    path: /api/public/vehicles/compare
    request:
      query:
        dealershipId: dealer-demo-001
        references: "{{params.vehicleReferences}}"
    response:
      success-http-status: [200]
      result: "{{body.vehicles}}"
      message: Current vehicles compared.
    authz:
      enabled: true
      resource-id: inventory-search
      operation-type: READ

  dealership_request_callback:
    method: POST
    path: /api/internal/actions/execute
    idempotency-header: Idempotency-Key
    request:
      body:
        actionId: "{{actionId}}"
        idempotencyKey: "{{idempotencyKey}}"
        params:
          confirmationAccepted: true
          vehicleId: "{{params.vehicleId}}"
          name: "{{params.name}}"
          email: "{{params.email}}"
          phone: "{{params.phone}}"
          message: "{{params.message}}"
          consent: "{{params.consent}}"
        trace:
          requestId: "{{trace.requestId}}"
          conversationId: "{{trace.conversationId}}"
          authContext: "{{trace.authContext}}"
    response:
      success-http-status: [200]
      message: Callback request created.
    authz:
      enabled: true
      resource-id: "{{params.vehicleId}}"
      operation-type: REQUEST_CALLBACK

  dealership_request_test_drive:
    method: POST
    path: /api/internal/actions/execute
    idempotency-header: Idempotency-Key
    request:
      body:
        actionId: "{{actionId}}"
        idempotencyKey: "{{idempotencyKey}}"
        params:
          confirmationAccepted: true
          vehicleId: "{{params.vehicleId}}"
          name: "{{params.name}}"
          email: "{{params.email}}"
          phone: "{{params.phone}}"
          preferredDate: "{{params.preferredDate}}"
          message: "{{params.message}}"
        trace:
          requestId: "{{trace.requestId}}"
          conversationId: "{{trace.conversationId}}"
          authContext: "{{trace.authContext}}"
    response:
      success-http-status: [200]
      message: Test-drive request created.
    authz:
      enabled: true
      resource-id: "{{params.vehicleId}}"
      operation-type: REQUEST_TEST_DRIVE
