ai-config:
  vector-dimensions: 512

ai-entities:
  dealer-vehicle:
    indexing:
      enabled: true
      max-characters: 8000
    analysis:
      enabled: false
      after: []
    searchable-fields:
      - name: content
        destinations: [SEMANTIC_SEARCH, RAG_CONTEXT]
        preprocessing: CLEAN
        priority: 100
        required: true
    metadata-fields:
      - name: tenantId
        data-type: ID
        destinations: [VECTOR_METADATA]
        priority: 100
        required: true
      - name: deploymentId
        data-type: ID
        destinations: [VECTOR_METADATA]
        priority: 100
        required: true
      - name: stockId
        data-type: ID
        destinations: [VECTOR_METADATA, API_RESPONSE]
        priority: 100
      - name: make
        data-type: STRING
        destinations: [VECTOR_METADATA, API_RESPONSE]
        priority: 80
      - name: fuelType
        data-type: STRING
        destinations: [VECTOR_METADATA, API_RESPONSE]
        priority: 80
      - name: bodyType
        data-type: STRING
        destinations: [VECTOR_METADATA, API_RESPONSE]
        priority: 80
      - name: lifecycleState
        data-type: STRING
        destinations: [VECTOR_METADATA]
        priority: 100
      - name: sourceLabel
        data-type: STRING
        destinations: [VECTOR_METADATA, API_RESPONSE]
        priority: 70
      - name: sourceUpdatedAt
        data-type: STRING
        destinations: [VECTOR_METADATA, API_RESPONSE]
        priority: 70
      - name: imageId
        data-type: ID
        destinations: [VECTOR_METADATA, API_RESPONSE]
        priority: 60
      - name: imageUrl
        data-type: STRING
        destinations: [VECTOR_METADATA, API_RESPONSE]
        priority: 60
