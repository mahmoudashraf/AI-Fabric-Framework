actions:
  - name: dealership_search_inventory
    description: Search the dealership's currently active vehicle inventory using buyer preferences and exact filters.
    category: dealership_inventory
    accessMode: READ
    anonymousAllowed: true
    requiresConfirmation: false
    groundingEligible: true
    readActionResolutionEligible: true
    llmFacts:
      lists:
        - sourcePath: _items
          target: items
          maxItems: 12
          includeFields:
            - id
            - stockId
            - slug
            - make
            - model
            - derivative
            - registrationYear
            - priceGbp
            - priceFormatted
            - mileage
            - fuelType
            - transmission
            - bodyType
            - exteriorColour
            - seats
            - electricRangeMiles
            - location
            - lifecycleState
            - summary
            - features
            - sourceLabel
            - sourceUpdatedAt
    params:
      - name: make
        description: Exact make filter when the buyer specified one.
        type: STRING
        required: false
      - name: fuelType
        description: Exact fuel type filter when specified.
        type: STRING
        required: false
      - name: bodyType
        description: Exact body type filter when specified.
        type: STRING
        required: false
      - name: maxPriceGbp
        description: Maximum budget as a whole number of GBP pounds.
        type: INTEGER
        required: false
      - name: maxMileage
        description: Maximum odometer mileage.
        type: INTEGER
        required: false
      - name: limit
        description: Maximum number of vehicles to return.
        type: INTEGER
        required: false
        min: 1
        max: 24

  - name: dealership_get_vehicle
    description: Load authoritative current details for a selected active dealership vehicle.
    category: dealership_inventory
    accessMode: READ
    anonymousAllowed: true
    requiresConfirmation: false
    groundingEligible: true
    readActionResolutionEligible: true
    llmFacts:
      objects:
        - sourcePath: vehicle
          target: vehicle
          includeFields:
            - id
            - stockId
            - slug
            - make
            - model
            - derivative
            - registrationYear
            - priceGbp
            - priceFormatted
            - mileage
            - fuelType
            - transmission
            - bodyType
            - exteriorColour
            - seats
            - electricRangeMiles
            - location
            - lifecycleState
            - summary
            - features
            - sourceLabel
            - sourceUpdatedAt
    params:
      - name: vehicleId
        description: Trusted vehicle target id returned by inventory search.
        type: STRING
        required: true
      - name: slug
        description: Trusted vehicle URL slug returned by inventory search.
        type: STRING
        required: true

  - name: dealership_resolve_vehicle
    description: Resolve one explicit buyer-facing vehicle reference to a trusted active dealership target.
    category: dealership_inventory
    accessMode: READ
    anonymousAllowed: true
    requiresConfirmation: false
    groundingEligible: true
    readActionResolutionEligible: true
    params:
      - name: reference
        description: Vehicle make and model, stock id or URL slug explicitly stated by the buyer.
        type: STRING
        required: true

  - name: dealership_compare_vehicles
    description: Compare current structured facts for two to four buyer-named active dealership vehicles.
    category: dealership_inventory
    accessMode: READ
    anonymousAllowed: true
    requiresConfirmation: false
    groundingEligible: true
    readActionResolutionEligible: true
    llmFacts:
      lists:
        - sourcePath: _items
          target: vehicles
          maxItems: 4
          includeFields:
            - id
            - stockId
            - slug
            - make
            - model
            - derivative
            - registrationYear
            - priceGbp
            - priceFormatted
            - mileage
            - fuelType
            - transmission
            - bodyType
            - exteriorColour
            - seats
            - electricRangeMiles
            - location
            - lifecycleState
            - summary
            - features
            - sourceLabel
            - sourceUpdatedAt
    params:
      - name: vehicleReferences
        description: Comma-separated vehicle make/model names, stock ids or slugs explicitly requested by the buyer or returned by inventory evidence.
        type: STRING
        required: true

  - name: dealership_request_callback
    description: Execute a dealership callback request only after the buyer asks to submit it and supplies the required buyer-owned details. Do not select this write action for requirements, preparation, explanation, or do-not-submit requests.
    category: dealership_lead
    accessMode: WRITE_ONLY
    anonymousAllowed: true
    requiresConfirmation: true
    confirmationMessage: Send your confirmed contact details to the dealership about this vehicle?
    params:
      - name: vehicle
        description: Buyer-facing vehicle make and model, stock id or URL slug.
        type: STRING
        required: true
      - name: vehicleId
        description: Trusted active vehicle id.
        type: STRING
        required: true
        visibility: INTERNAL
        askUser: false
        resolveFrom:
          source: READ_ACTION
          actionName: dealership_resolve_vehicle
          params:
            reference: "{{params.vehicle|context.originalQuery}}"
          resultPath: vehicleId
      - name: name
        description: Customer name.
        type: STRING
        required: true
        sensitive: true
      - name: email
        description: Customer email address; email or phone is required.
        type: STRING
        required: false
        sensitive: true
      - name: phone
        description: Customer telephone number; phone or email is required.
        type: STRING
        required: false
        sensitive: true
      - name: message
        description: Optional callback notes.
        type: STRING
        required: false
        sensitive: true
      - name: consent
        description: Whether the customer agreed to be contacted about this request.
        type: BOOLEAN
        required: true

  - name: dealership_request_test_drive
    description: Execute a dealership test-drive request only after the buyer asks to submit it and supplies the required buyer-owned details. Do not select this write action for requirements, preparation, explanation, or do-not-submit requests.
    category: dealership_lead
    accessMode: WRITE_ONLY
    anonymousAllowed: true
    requiresConfirmation: true
    confirmationMessage: Send your confirmed contact and preferred date to request this test drive?
    params:
      - name: vehicle
        description: Buyer-facing vehicle make and model, stock id or URL slug.
        type: STRING
        required: true
      - name: vehicleId
        description: Trusted active vehicle id.
        type: STRING
        required: true
        visibility: INTERNAL
        askUser: false
        resolveFrom:
          source: READ_ACTION
          actionName: dealership_resolve_vehicle
          params:
            reference: "{{params.vehicle|context.originalQuery}}"
          resultPath: vehicleId
      - name: name
        description: Customer name.
        type: STRING
        required: true
        sensitive: true
      - name: email
        description: Customer email address; email or phone is required.
        type: STRING
        required: false
        sensitive: true
      - name: phone
        description: Customer telephone number; phone or email is required.
        type: STRING
        required: false
        sensitive: true
      - name: preferredDate
        description: Customer's preferred test-drive date or date range.
        type: STRING
        required: false
      - name: message
        description: Optional test-drive notes.
        type: STRING
        required: false
        sensitive: true
      - name: consent
        description: Whether the customer agreed to be contacted about this request.
        type: BOOLEAN
        required: true
