actions:
  - name: dealership_search_inventory
    description: Search current synchronized stock using only explicit constraints supported by the typed parameters. Preserve stated fuel, budget, mileage and supported body style constraints. Suitability requests such as family-friendly, practical, spacious or commuting are not categorical filters; assess them only from returned vehicle facts and disclose missing evidence. Never invent a body style or silently relax an explicit filter. For electric vehicles under GBP40000 suitable for a family, use fuelType Electric and maxPriceGbp 40000; omit bodyType and make unless explicitly stated.
    category: dealership_inventory
    accessMode: READ
    anonymousAllowed: true
    requiresConfirmation: false
    groundingEligible: true
    groundingVectorSpaces:
      - dealer-vehicle
    readActionResolutionEligible: true
    llmFacts:
      lists:
        - sourcePath: results
          target: items
          maxItems: 24
          includeFields:
            - stockId
            - make
            - model
            - derivative
            - year
            - priceGbp
            - mileage
            - fuelType
            - transmission
            - bodyType
            - availability
            - advertStatus
            - features
            - imageId
            - imageUrl
    params:
      - name: make
        description: Exact vehicle manufacturer brand only. Put fuel or powertrain terms in fuelType. Omit when no manufacturer was stated; do not send an empty string or a suitability term.
        type: STRING
        required: false
      - name: fuelType
        description: Explicit buyer-stated fuel type from allowedValues, using its canonical spelling (for example, electric becomes Electric). Omit when no fuel type was stated.
        type: STRING
        required: false
        allowedValues:
          - Electric
          - Petrol
          - Diesel
          - Hybrid
          - Plug-in hybrid
      - name: bodyType
        description: Explicit buyer-stated vehicle body style from allowedValues, using its canonical spelling. Omit when no supported body style was stated; never infer SUV or another body style from intended use. Family, family-friendly, practical, spacious and commuting are suitability criteria, not body styles. If an unsupported body style is an explicit hard requirement, ask for clarification rather than silently dropping or replacing it. This integration vocabulary must be reviewed against the bound external stock provider before adoption.
        type: STRING
        required: false
        allowedValues:
          - SUV
          - Estate
          - Hatchback
          - Saloon
          - Crossover
      - name: maxPriceGbp
        description: Maximum budget from phrases such as under or up to GBP N, represented as a positive whole number of GBP pounds. Omit this parameter when the buyer did not state a budget; never use zero as a missing-value marker.
        type: INTEGER
        required: false
        min: 1
      - name: maxMileage
        description: Maximum odometer mileage stated by the buyer, represented as a positive whole number. Omit this parameter when the buyer did not state a mileage limit; never use zero as a missing-value marker.
        type: INTEGER
        required: false
        min: 1
      - name: limit
        description: Maximum number of vehicles to return.
        type: INTEGER
        required: false
        min: 1
        max: 24

  - name: dealership_get_vehicle
    description: Load one authoritative current provider stock record only when a trusted attached or conversation working target supplies its provider stock ID. A buyer-facing name in a new request is discovery input and must use inventory search instead.
    category: dealership_inventory
    accessMode: READ
    anonymousAllowed: true
    requiresConfirmation: false
    groundingEligible: true
    groundingVectorSpaces:
      - dealer-vehicle
    readActionResolutionEligible: true
    llmFacts:
      objects:
        - sourcePath: vehicleRecord
          target: vehicle
          includeFields:
            - stockId
            - make
            - model
            - derivative
            - year
            - priceGbp
            - mileage
            - fuelType
            - transmission
            - bodyType
            - availability
            - advertStatus
            - features
            - imageId
            - imageUrl
    params:
      - name: vehicle
        description: Exact Auto Trader stock ID from trusted attached vehicle context or a prior provider stock result. Do not ask the buyer for this internal lookup value.
        type: STRING
        required: true
        visibility: INTERNAL
        askUser: false
        resolveFrom:
          source: ATTACHMENT_METADATA
          metadataKeys:
            - lookupValue
            - stockId
            - vehicleId
            - id
        evidenceBound: true
        evidenceKeys:
          - lookupValue
          - stockId
          - vehicleId
          - id
        evidenceFallbackPolicy: CLARIFY

  - name: dealership_compare_vehicles
    description: Compare current structured facts for two to four buyer-named active dealership vehicles.
    category: dealership_inventory
    accessMode: READ
    anonymousAllowed: true
    requiresConfirmation: false
    groundingEligible: true
    groundingVectorSpaces:
      - dealer-vehicle
    readActionResolutionEligible: true
    llmFacts:
      lists:
        - sourcePath: _items
          target: vehicles
          maxItems: 4
          includeFields:
            - id
            - stockId
            - slug
            - make
            - model
            - derivative
            - registrationYear
            - priceGbp
            - priceFormatted
            - mileage
            - fuelType
            - transmission
            - bodyType
            - exteriorColour
            - seats
            - location
            - lifecycleState
            - summary
            - features
            - sourceLabel
            - sourceUpdatedAt
    params:
      - name: vehicleReferences
        description: Comma-separated vehicle make/model names, stock ids or slugs explicitly requested by the buyer or returned by inventory evidence.
        type: STRING
        required: true

  - name: dealership_request_callback
    description: Execute a dealership callback request only after the buyer asks to submit it and supplies the required buyer-owned details. Do not select this write action for requirements, preparation, explanation, or do-not-submit requests.
    category: dealership_lead
    accessMode: WRITE_ONLY
    anonymousAllowed: true
    requiresConfirmation: true
    confirmationMessage: Send your confirmed contact details to the dealership about this vehicle?
    params:
      - name: vehicle
        description: Buyer-facing vehicle make and model, stock id or URL slug.
        type: STRING
        required: true
      - name: name
        description: Customer name.
        type: STRING
        required: true
        sensitive: true
      - name: email
        description: Customer email address; email or phone is required.
        type: STRING
        required: false
        sensitive: true
      - name: phone
        description: Customer telephone number for the requested callback.
        type: STRING
        required: true
        sensitive: true
      - name: message
        description: Optional callback notes.
        type: STRING
        required: false
        sensitive: true
      - name: consent
        description: Whether the customer agreed to be contacted about this request.
        type: BOOLEAN
        required: true

  - name: dealership_request_test_drive
    description: Execute a dealership test-drive request only after the buyer asks to submit it, supplies their name and contact details, and accepts the final confirmation. Do not select this write action for requirements, preparation, explanation, or do-not-submit requests.
    category: dealership_lead
    accessMode: WRITE_ONLY
    anonymousAllowed: true
    requiresConfirmation: true
    confirmationMessage: "Send the supplied contact details to request a test drive for {{vehicle}}, preferred date {{preferredDate|not specified}}?"
    params:
      - name: vehicle
        description: Buyer-facing vehicle make and model, stock id or URL slug.
        type: STRING
        required: true
      - name: name
        description: Customer name.
        type: STRING
        required: true
        sensitive: true
      - name: email
        description: Customer email address.
        type: STRING
        required: true
        sensitive: true
      - name: phone
        description: Customer telephone number.
        type: STRING
        required: true
        sensitive: true
      - name: preferredDate
        description: Customer's preferred test-drive date or date range.
        type: STRING
        required: false
      - name: message
        description: Optional test-drive notes.
        type: STRING
        required: false
        sensitive: true
