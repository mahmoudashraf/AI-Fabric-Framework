actions:
  - name: dealership_search_inventory
    description: Read the dealership account's current provider stock through the Auto Trader stock contract, then apply every buyer preference to the returned facts.
    category: dealership_inventory
    accessMode: READ
    anonymousAllowed: true
    requiresConfirmation: false
    groundingEligible: true
    groundingVectorSpaces:
      - dealer-vehicle
    readActionResolutionEligible: true
    llmFacts:
      lists:
        - sourcePath: results
          target: items
          maxItems: 24
          includeFields:
            - stockId
            - make
            - model
            - derivative
            - year
            - priceGbp
            - mileage
            - fuelType
            - transmission
            - bodyType
            - availability
            - advertStatus
            - features
            - imageId
            - imageUrl
    params:
      - name: make
        description: Exact vehicle manufacturer brand only, such as Aster, Northstar or Arden. Never place a fuel or powertrain term such as Electric, Petrol, Diesel, Hybrid or Plug-in Hybrid in this parameter; use fuelType for those terms.
        type: STRING
        required: false
      - name: fuelType
        description: Exact buyer-stated fuel type filter, such as Electric, Diesel, Hybrid or Plug-in Hybrid.
        type: STRING
        required: false
        allowedValues:
          - Electric
          - Petrol
          - Diesel
          - Hybrid
          - Plug-in hybrid
      - name: bodyType
        description: Exact buyer-stated body type filter, such as SUV, Estate or Hatchback.
        type: STRING
        required: false
      - name: maxPriceGbp
        description: Maximum budget from phrases such as under or up to GBP N, represented as a positive whole number of GBP pounds. Omit this parameter when the buyer did not state a budget; never use zero as a missing-value marker.
        type: INTEGER
        required: false
        min: 1
      - name: maxMileage
        description: Maximum odometer mileage stated by the buyer, represented as a positive whole number. Omit this parameter when the buyer did not state a mileage limit; never use zero as a missing-value marker.
        type: INTEGER
        required: false
        min: 1
      - name: limit
        description: Maximum number of vehicles to return.
        type: INTEGER
        required: false
        min: 1
        max: 24

  - name: dealership_get_vehicle
    description: Load one authoritative current provider stock record only when a trusted attached or conversation working target supplies its provider stock ID. A buyer-facing name in a new request is discovery input and must use inventory search instead.
    category: dealership_inventory
    accessMode: READ
    anonymousAllowed: true
    requiresConfirmation: false
    groundingEligible: true
    groundingVectorSpaces:
      - dealer-vehicle
    readActionResolutionEligible: true
    llmFacts:
      objects:
        - sourcePath: vehicleRecord
          target: vehicle
          includeFields:
            - stockId
            - make
            - model
            - derivative
            - year
            - priceGbp
            - mileage
            - fuelType
            - transmission
            - bodyType
            - availability
            - advertStatus
            - features
            - imageId
            - imageUrl
    params:
      - name: vehicle
        description: Exact Auto Trader stock ID from trusted attached vehicle context or a prior provider stock result. Do not ask the buyer for this internal lookup value.
        type: STRING
        required: true
        visibility: INTERNAL
        askUser: false
        resolveFrom:
          source: ATTACHMENT_METADATA
          metadataKeys:
            - lookupValue
            - stockId
            - vehicleId
            - id
        evidenceBound: true
        evidenceKeys:
          - lookupValue
          - stockId
          - vehicleId
          - id
        evidenceFallbackPolicy: CLARIFY

  - name: dealership_compare_vehicles
    description: Compare current structured facts for two to four buyer-named active dealership vehicles.
    category: dealership_inventory
    accessMode: READ
    anonymousAllowed: true
    requiresConfirmation: false
    groundingEligible: true
    groundingVectorSpaces:
      - dealer-vehicle
    readActionResolutionEligible: true
    llmFacts:
      lists:
        - sourcePath: _items
          target: vehicles
          maxItems: 4
          includeFields:
            - id
            - stockId
            - slug
            - make
            - model
            - derivative
            - registrationYear
            - priceGbp
            - priceFormatted
            - mileage
            - fuelType
            - transmission
            - bodyType
            - exteriorColour
            - seats
            - location
            - lifecycleState
            - summary
            - features
            - sourceLabel
            - sourceUpdatedAt
    params:
      - name: vehicleReferences
        description: Comma-separated vehicle make/model names, stock ids or slugs explicitly requested by the buyer or returned by inventory evidence.
        type: STRING
        required: true

  - name: dealership_request_callback
    description: Execute a dealership callback request only after the buyer asks to submit it and supplies the required buyer-owned details. Do not select this write action for requirements, preparation, explanation, or do-not-submit requests.
    category: dealership_lead
    accessMode: WRITE_ONLY
    anonymousAllowed: true
    requiresConfirmation: true
    confirmationMessage: Send your confirmed contact details to the dealership about this vehicle?
    params:
      - name: vehicle
        description: Buyer-facing vehicle make and model, stock id or URL slug.
        type: STRING
        required: true
      - name: name
        description: Customer name.
        type: STRING
        required: true
        sensitive: true
      - name: email
        description: Customer email address; email or phone is required.
        type: STRING
        required: false
        sensitive: true
      - name: phone
        description: Customer telephone number for the requested callback.
        type: STRING
        required: true
        sensitive: true
      - name: message
        description: Optional callback notes.
        type: STRING
        required: false
        sensitive: true
      - name: consent
        description: Whether the customer agreed to be contacted about this request.
        type: BOOLEAN
        required: true

  - name: dealership_request_test_drive
    description: Execute a dealership test-drive request only after the buyer asks to submit it, supplies their name and contact details, and accepts the final confirmation. Do not select this write action for requirements, preparation, explanation, or do-not-submit requests.
    category: dealership_lead
    accessMode: WRITE_ONLY
    anonymousAllowed: true
    requiresConfirmation: true
    confirmationMessage: Send your name, contact details and preferred date to request this test drive?
    params:
      - name: vehicle
        description: Buyer-facing vehicle make and model, stock id or URL slug.
        type: STRING
        required: true
      - name: name
        description: Customer name.
        type: STRING
        required: true
        sensitive: true
      - name: email
        description: Customer email address.
        type: STRING
        required: true
        sensitive: true
      - name: phone
        description: Customer telephone number.
        type: STRING
        required: true
        sensitive: true
      - name: preferredDate
        description: Customer's preferred test-drive date or date range.
        type: STRING
        required: false
      - name: message
        description: Optional test-drive notes.
        type: STRING
        required: false
        sensitive: true
