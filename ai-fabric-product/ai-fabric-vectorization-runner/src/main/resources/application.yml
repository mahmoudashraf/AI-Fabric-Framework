server:
  port: ${PORT:8099}
  shutdown: graceful

spring:
  application:
    name: ai-fabric-vectorization-runner

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.ai.fabric.vectorization.runner: INFO
