server:
  port: ${PORT:8085}

spring:
  application:
    name: basic-loomai-inbox
  datasource:
    url: ${BASIC_INBOX_JDBC_URL:jdbc:h2:file:./data/basic-inbox;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${BASIC_INBOX_JDBC_USERNAME:sa}
    password: ${BASIC_INBOX_JDBC_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/basic-inbox-migration

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

ai:
  enabled: false

loomai:
  basic-inbox:
    binding-id: ${BASIC_INBOX_BINDING_ID:}
    tenant-id: ${BASIC_INBOX_TENANT_ID:}
    deployment-id: ${BASIC_INBOX_DEPLOYMENT_ID:}
    provider-api-key: ${BASIC_INBOX_PROVIDER_API_KEY:}
    connector-callback-url: ${BASIC_INBOX_CONNECTOR_CALLBACK_URL:}
    callback-signing-secret: ${BASIC_INBOX_CALLBACK_SIGNING_SECRET:}
    data-encryption-secret: ${BASIC_INBOX_DATA_ENCRYPTION_SECRET:}
    operators: ${BASIC_INBOX_OPERATORS:}
    request-timeout: ${BASIC_INBOX_REQUEST_TIMEOUT:10s}
    max-callback-attempts: ${BASIC_INBOX_MAX_CALLBACK_ATTEMPTS:8}
    callback-retry-delay: ${BASIC_INBOX_CALLBACK_RETRY_DELAY:5s}
    retention: ${BASIC_INBOX_RETENTION:30d}
