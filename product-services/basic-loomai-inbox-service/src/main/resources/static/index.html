<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basic LoomAI Inbox</title>
  <link rel="stylesheet" href="/inbox.css">
</head>
<body>
  <div id="login" class="login-shell">
    <form id="login-form" class="login-panel">
      <div class="brand-mark">L</div>
      <div>
        <p class="eyebrow">LOOM AI LABS</p>
        <h1>Basic Inbox</h1>
        <p class="muted">Operator access for low-volume human conversations.</p>
      </div>
      <label>Operator API key<input id="operator-key" type="password" autocomplete="current-password" required></label>
      <button type="submit">Open inbox</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </div>

  <main id="app" class="app-shell" hidden>
    <header class="topbar">
      <div class="brand-inline"><span class="brand-mark small">L</span><strong>Basic LoomAI Inbox</strong></div>
      <div class="operator"><span id="operator-name"></span><button id="logout" class="quiet">Sign out</button></div>
    </header>

    <section class="workspace">
      <aside class="queue-pane">
        <div class="pane-heading">
          <div><p class="eyebrow">CONVERSATIONS</p><h2>Queue</h2></div>
          <button id="refresh" class="icon-button" title="Refresh queue" aria-label="Refresh queue">↻</button>
        </div>
        <div class="filters" role="group" aria-label="Queue status">
          <button data-status="" class="active">All</button>
          <button data-status="WAITING">Waiting</button>
          <button data-status="ACTIVE">Active</button>
        </div>
        <div id="queue" class="queue-list"></div>
        <section class="delivery-panel" aria-labelledby="delivery-title">
          <div class="delivery-heading">
            <div><p class="eyebrow">DELIVERY</p><h3 id="delivery-title">Callback issues</h3></div>
            <span id="delivery-count" class="status">0</span>
          </div>
          <div id="delivery-issues" class="delivery-list"></div>
        </section>
      </aside>

      <section class="conversation-pane">
        <div id="empty" class="empty-state">
          <p class="eyebrow">SELECT A CONVERSATION</p>
          <h2>Human support starts here.</h2>
          <p>Claim a waiting conversation, reply safely, then explicitly return it to AI or close it.</p>
        </div>

        <div id="conversation" hidden>
          <header class="conversation-heading">
            <div><p id="conversation-label" class="eyebrow"></p><h2 id="conversation-title"></h2></div>
            <span id="conversation-status" class="status"></span>
          </header>
          <div id="intake" class="intake-strip" hidden></div>
          <div id="messages" class="messages" aria-live="polite"></div>
          <footer class="composer">
            <div class="actions">
              <button id="claim" class="secondary">Claim</button>
              <button id="return-ai" class="secondary">Return to AI</button>
              <button id="close" class="danger">Close</button>
            </div>
            <form id="reply-form">
              <label class="sr-only" for="reply">Reply</label>
              <textarea id="reply" rows="2" maxlength="20000" placeholder="Write a human reply..."></textarea>
              <button type="submit">Send</button>
            </form>
            <p id="action-error" class="error" role="alert"></p>
          </footer>
        </div>
      </section>
    </section>
  </main>
  <script src="/inbox.js" defer></script>
</body>
</html>
