server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: shopify-bridge-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

shopify:
  bridge:
    app-name: ${SHOPIFY_BRIDGE_APP_NAME:Shopify Bridge Service}
    service-ref: ${SHOPIFY_BRIDGE_SERVICE_REF:shopify-bridge-local}
    product-family: ${SHOPIFY_BRIDGE_PRODUCT_FAMILY:SHOPIFY}
    service-kind: ${SHOPIFY_BRIDGE_SERVICE_KIND:SHOPIFY_BRIDGE_SERVICE}
    environment-scope: ${SHOPIFY_BRIDGE_ENVIRONMENT_SCOPE:local}
    public-base-url: ${SHOPIFY_BRIDGE_PUBLIC_BASE_URL:}
    platform-base-url: ${SHOPIFY_BRIDGE_PLATFORM_BASE_URL:}
    platform-admin-api-key: ${SHOPIFY_BRIDGE_PLATFORM_ADMIN_API_KEY:}
    platform-admin-api-key-header: ${SHOPIFY_BRIDGE_PLATFORM_ADMIN_API_KEY_HEADER:X-PLATFORM-API-KEY}
    admin-api-key: ${SHOPIFY_BRIDGE_SHARED_SECRET:}
    admin-api-key-header: ${SHOPIFY_BRIDGE_ADMIN_API_KEY_HEADER:X-BRIDGE-API-KEY}

logging:
  level:
    com.ai.fabric.product.shopify.bridge: INFO
