name: Coolify Image Artifacts

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag to publish in addition to the commit SHA.
        required: false
        default: staging
  push:
    branches:
      - main
      - Platform-V8
    paths:
      - ai-infrastructure-module/ai-fabric-runtime/**
      - ai-infrastructure-module/ai-infrastructure-generic-rest-connector/**
      - .github/workflows/coolify-image-artifacts.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ai-fabric-runtime
            context: ai-infrastructure-module
            dockerfile: ai-infrastructure-module/ai-fabric-runtime/Dockerfile
            image: ghcr.io/${{ github.repository }}/ai-fabric-runtime
          - service: ai-fabric-rest-connector
            context: ai-infrastructure-module
            dockerfile: ai-infrastructure-module/ai-infrastructure-generic-rest-connector/Dockerfile
            image: ghcr.io/${{ github.repository }}/ai-fabric-rest-connector
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:${{ github.event.inputs.image_tag || 'staging' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            ai.fabric.coolify.service=${{ matrix.service }}

      - name: Artifact metadata
        run: |
          mkdir -p coolify-artifacts
          cat > "coolify-artifacts/${{ matrix.service }}.json" <<JSON
          {
            "serviceName": "${{ matrix.service }}",
            "artifactType": "DOCKER_IMAGE",
            "imageRepository": "${{ matrix.image }}",
            "imageTag": "${{ github.sha }}",
            "imageDigest": "${{ steps.build.outputs.digest }}",
            "gitCommitSha": "${{ github.sha }}",
            "buildRunId": "${{ github.run_id }}"
          }
          JSON

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: coolify-artifact-${{ matrix.service }}
          path: coolify-artifacts/${{ matrix.service }}.json
