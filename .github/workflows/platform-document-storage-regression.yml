name: Platform document storage regression

on:
  workflow_dispatch:
  push:
    branches: [Platform-V11]
    paths:
      - .github/workflows/platform-document-storage-regression.yml
      - Platfrom/backend/pom.xml
      - Platfrom/backend/src/main/java/com/ai/fabric/platform/backend/documentstorage/**
      - Platfrom/backend/src/test/java/com/ai/fabric/platform/backend/documentstorage/**
      - Platfrom/backend/src/test/**/*Document*.java
      - Platfrom/backend/src/main/java/db/migration/V23*.java
      - Platfrom/backend/src/main/resources/db/migration/V230__*.sql
      - Platfrom/backend/src/main/java/com/ai/fabric/platform/backend/deployment/service/DeploymentDocument*.java
      - Platfrom/backend/src/main/java/com/ai/fabric/platform/backend/deployment/service/DeploymentPromotionCandidateService.java
      - Platfrom/backend/src/main/java/com/ai/fabric/platform/backend/deployment/service/DeploymentPracticalPromotionService.java
      - Platfrom/backend/src/main/java/com/ai/fabric/platform/backend/marketplace/service/MarketplaceManifestService.java
      - Platfrom/ui/src/components/documents/**
      - Platfrom/ui/src/api/documentStorageApi.ts
      - Platfrom/ui/src/api/platformApi.ts
      - Platfrom/ui/package.json
      - Platfrom/ui/src/pages/DocumentKnowledgePage.tsx
      - Platfrom/ui/src/components/kits/ExperienceKitOverview.tsx
      - Platfrom/ui/src/components/customer/CustomerDeploymentConsole.tsx

permissions:
  contents: read

concurrency:
  group: platform-document-storage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Storage, ownership, document contracts and promotion
        run: >-
          mvn -B -f Platfrom/backend/pom.xml
          -Dtest=DocumentStorageApplicationTest,CustomerDocumentStorageServiceTest,DocumentStorageSelectionServiceTest,DocumentStoragePromotionSelectionServiceTest,DocumentStorageMetadataPostgresTest,AwsCustomerDocumentStorageProviderTest,DeploymentDocumentStorageBindingServiceTest,DeploymentDocumentBindingResolverTest,CustomerDocumentStorageBindingServiceTest,DeploymentPromotionCandidateServiceTest,DeploymentPracticalPromotionServiceTest,DocumentKnowledgeModeNeutralMigrationTest,DocumentKnowledgeModeNeutralMigrationPostgresTest,DocumentBootstrapOfferRevisionMigrationTest,DeploymentDocumentContractCompilerTest,MarketplaceManifestServiceTest,DeploymentDraftValidationServiceTest
          test
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Platfrom/ui/package-lock.json
      - name: UI dependencies
        working-directory: Platfrom/ui
        run: npm ci
      - name: UI execution and authority contracts
        working-directory: Platfrom/ui
        run: npm run test:document-storage
      - name: Browser installation
        working-directory: Platfrom/ui
        run: npx playwright install --with-deps chromium
      - name: Mocked browser document journeys
        working-directory: Platfrom/ui
        run: npm run smoke:document-storage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-storage-junit
          path: Platfrom/backend/target/surefire-reports
