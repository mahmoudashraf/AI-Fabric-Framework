name: Platform Admin Live Regression

run-name: Platform admin live regression

on:
  workflow_dispatch:
    inputs:
      platform_base_url:
        description: Platform public base URL override. Leave empty to use repo variable or secret.
        required: false
        type: string
        default: ''
      run_code_regression:
        description: Run code regression before live checks.
        required: false
        type: boolean
        default: false
      run_platform_admin_smoke:
        description: Run platform-admin-only live API regression, including user directory, assignments, notifications, and async deletion smoke.
        required: false
        type: boolean
        default: true
      run_ecommerce_vectorization:
        description: Run live ecommerce deployment verification with write-backed checks.
        required: false
        type: boolean
        default: true
      run_vector_deployments:
        description: Run live vector deployment verification with write-backed checks.
        required: false
        type: boolean
        default: true
      run_tenant_isolation:
        description: Run tenant-scoped shared isolation verification against the configured counterpart pair.
        required: false
        type: boolean
        default: true
      run_managed_provider_checks:
        description: Run managed provider verification.
        required: false
        type: boolean
        default: true
      ensure_canonical_rollouts:
        description: Recreate missing or unready canonical rollout deployments before ecommerce/vector checks.
        required: false
        type: boolean
        default: false
      run_canonical_rollout_mutation:
        description: Manually exercise canonical rollout recreate/cleanup. This mutates the regression fleet and should be used only intentionally.
        required: false
        type: boolean
        default: false
      ecommerce_deployment_id:
        description: Ecommerce deployment id override.
        required: false
        type: string
        default: ''
      admin_target_deployment_id:
        description: Deployment id used for admin-only access-overview and assignment smoke checks. Leave empty to fall back to ecommerce, then qdrant.
        required: false
        type: string
        default: ''
      qdrant_deployment_id:
        description: Qdrant deployment id override.
        required: false
        type: string
        default: ''
      pinecone_deployment_id:
        description: Pinecone deployment id override.
        required: false
        type: string
        default: ''
      milvus_deployment_id:
        description: Milvus deployment id override.
        required: false
        type: string
        default: ''
      weaviate_deployment_id:
        description: Weaviate deployment id override.
        required: false
        type: string
        default: ''
      tenant_primary_deployment_id:
        description: Primary tenant-shared verification deployment id override.
        required: false
        type: string
        default: ''
      tenant_counterpart_deployment_id:
        description: Counterpart tenant-shared verification deployment id override.
        required: false
        type: string
        default: ''
      canonical_rollout_keys:
        description: Comma-separated canonical rollout keys for manual recreate/cleanup mutation, for example ecommerce,qdrant.
        required: false
        type: string
        default: ''
  schedule:
    - cron: '30 2 * * *'

jobs:
  resolve-context:
    name: Resolve live regression context
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      platform_base_url: ${{ steps.resolve.outputs.platform_base_url }}
      admin_target_deployment_id: ${{ steps.resolve.outputs.admin_target_deployment_id }}
      ecommerce_deployment_id: ${{ steps.resolve.outputs.ecommerce_deployment_id }}
      qdrant_deployment_id: ${{ steps.resolve.outputs.qdrant_deployment_id }}
      pinecone_deployment_id: ${{ steps.resolve.outputs.pinecone_deployment_id }}
      milvus_deployment_id: ${{ steps.resolve.outputs.milvus_deployment_id }}
      weaviate_deployment_id: ${{ steps.resolve.outputs.weaviate_deployment_id }}
      tenant_primary_deployment_id: ${{ steps.resolve.outputs.tenant_primary_deployment_id }}
      tenant_counterpart_deployment_id: ${{ steps.resolve.outputs.tenant_counterpart_deployment_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve workflow inputs and repository variables
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RUN_PLATFORM_ADMIN_SMOKE: ${{ inputs.run_platform_admin_smoke }}
          INPUT_RUN_ECOMMERCE_VECTORIZATION: ${{ inputs.run_ecommerce_vectorization }}
          INPUT_RUN_VECTOR_DEPLOYMENTS: ${{ inputs.run_vector_deployments }}
          INPUT_RUN_TENANT_ISOLATION: ${{ inputs.run_tenant_isolation }}
          INPUT_ENSURE_CANONICAL_ROLLOUTS: ${{ inputs.ensure_canonical_rollouts }}
          INPUT_RUN_CANONICAL_ROLLOUT_MUTATION: ${{ inputs.run_canonical_rollout_mutation }}
          INPUT_PLATFORM_BASE_URL: ${{ inputs.platform_base_url }}
          INPUT_ADMIN_TARGET_DEPLOYMENT_ID: ${{ inputs.admin_target_deployment_id }}
          INPUT_ECOMMERCE_DEPLOYMENT_ID: ${{ inputs.ecommerce_deployment_id }}
          INPUT_QDRANT_DEPLOYMENT_ID: ${{ inputs.qdrant_deployment_id }}
          INPUT_PINECONE_DEPLOYMENT_ID: ${{ inputs.pinecone_deployment_id }}
          INPUT_MILVUS_DEPLOYMENT_ID: ${{ inputs.milvus_deployment_id }}
          INPUT_WEAVIATE_DEPLOYMENT_ID: ${{ inputs.weaviate_deployment_id }}
          INPUT_TENANT_PRIMARY_DEPLOYMENT_ID: ${{ inputs.tenant_primary_deployment_id }}
          INPUT_TENANT_COUNTERPART_DEPLOYMENT_ID: ${{ inputs.tenant_counterpart_deployment_id }}
          INPUT_CANONICAL_ROLLOUT_KEYS: ${{ inputs.canonical_rollout_keys }}
          VAR_PLATFORM_BASE_URL: ${{ vars.PLATFORM_BASE_URL }}
          VAR_REGRESSION_TENANT_PRIMARY_DEPLOYMENT_ID: ${{ vars.REGRESSION_TENANT_PRIMARY_DEPLOYMENT_ID }}
          VAR_REGRESSION_TENANT_COUNTERPART_DEPLOYMENT_ID: ${{ vars.REGRESSION_TENANT_COUNTERPART_DEPLOYMENT_ID }}
          PLATFORM_API_KEY: ${{ secrets.PLATFORM_API_KEY }}
          PLATFORM_LOGIN_EMAIL: ${{ secrets.PLATFORM_LOGIN_EMAIL }}
          PLATFORM_LOGIN_PASSWORD: ${{ secrets.PLATFORM_LOGIN_PASSWORD }}
        run: |
          set -euo pipefail

          choose() {
            local first="$1"
            local second="$2"
            if [[ -n "${first}" ]]; then
              printf '%s' "${first}"
            else
              printf '%s' "${second}"
            fi
          }

          platform_base_url="$(choose "${INPUT_PLATFORM_BASE_URL:-}" "${VAR_PLATFORM_BASE_URL:-}")"
          tenant_primary_deployment_id="$(choose "${INPUT_TENANT_PRIMARY_DEPLOYMENT_ID:-}" "${VAR_REGRESSION_TENANT_PRIMARY_DEPLOYMENT_ID:-}")"
          tenant_counterpart_deployment_id="$(choose "${INPUT_TENANT_COUNTERPART_DEPLOYMENT_ID:-}" "${VAR_REGRESSION_TENANT_COUNTERPART_DEPLOYMENT_ID:-}")"

          should_run_platform_admin="false"
          should_run_ecommerce="false"
          should_run_vectors="false"
          should_run_tenant_isolation="false"
          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            should_run_platform_admin="true"
            should_run_ecommerce="true"
            should_run_vectors="true"
            should_run_tenant_isolation="true"
          else
            [[ "${INPUT_RUN_PLATFORM_ADMIN_SMOKE:-false}" == "true" ]] && should_run_platform_admin="true"
            [[ "${INPUT_RUN_ECOMMERCE_VECTORIZATION:-false}" == "true" ]] && should_run_ecommerce="true"
            [[ "${INPUT_RUN_VECTOR_DEPLOYMENTS:-false}" == "true" ]] && should_run_vectors="true"
            [[ "${INPUT_RUN_TENANT_ISOLATION:-false}" == "true" ]] && should_run_tenant_isolation="true"
          fi

          should_resolve_rollouts="false"
          required_rollout_keys=""
          if [[ "${should_run_ecommerce}" == "true" ]]; then
            should_resolve_rollouts="true"
            required_rollout_keys="ecommerce"
          fi
          if [[ "${should_run_vectors}" == "true" ]]; then
            should_resolve_rollouts="true"
            if [[ -n "${required_rollout_keys}" ]]; then
              required_rollout_keys="${required_rollout_keys},qdrant,pinecone,milvus,weaviate"
            else
              required_rollout_keys="qdrant,pinecone,milvus,weaviate"
            fi
          fi

          if [[ ("${should_run_platform_admin}" == "true" || "${should_run_ecommerce}" == "true" || "${should_run_vectors}" == "true" || "${should_run_tenant_isolation}" == "true") && -z "${platform_base_url}" ]]; then
            echo "Missing platform base URL. Set workflow input platform_base_url or repo variable PLATFORM_BASE_URL." >&2
            exit 1
          fi
          if [[ "${should_run_tenant_isolation}" == "true" ]]; then
            if [[ -z "${tenant_primary_deployment_id}" || -z "${tenant_counterpart_deployment_id}" ]]; then
              echo "Missing tenant isolation deployment pair. Set workflow inputs tenant_primary_deployment_id and tenant_counterpart_deployment_id or repository variables REGRESSION_TENANT_PRIMARY_DEPLOYMENT_ID and REGRESSION_TENANT_COUNTERPART_DEPLOYMENT_ID." >&2
              exit 1
            fi
          fi
          if [[ "${INPUT_RUN_CANONICAL_ROLLOUT_MUTATION:-false}" == "true" && -z "${INPUT_CANONICAL_ROLLOUT_KEYS:-}" ]]; then
            echo "Canonical rollout mutation requires canonical_rollout_keys. Refusing to mutate the regression fleet without explicit selected keys." >&2
            exit 1
          fi

          resolved_json='{}'
          if [[ "${should_resolve_rollouts}" == "true" ]]; then
            resolved_json="$(
              PLATFORM_BASE_URL="${platform_base_url}" \
              REQUIRED_ROLLOUT_KEYS="${required_rollout_keys}" \
              ALLOW_ROLLOUT_MUTATION="${INPUT_ENSURE_CANONICAL_ROLLOUTS:-false}" \
              WAIT_FOR_VERIFICATION_READY=true \
              PLATFORM_API_KEY="${PLATFORM_API_KEY:-}" \
              PLATFORM_LOGIN_EMAIL="${PLATFORM_LOGIN_EMAIL:-}" \
              PLATFORM_LOGIN_PASSWORD="${PLATFORM_LOGIN_PASSWORD:-}" \
              bash scripts/resolve-verification-rollouts.sh
            )"
          fi

          RESOLVED_JSON="${resolved_json}" \
          INPUT_ADMIN_TARGET_DEPLOYMENT_ID="${INPUT_ADMIN_TARGET_DEPLOYMENT_ID:-}" \
          INPUT_ECOMMERCE_DEPLOYMENT_ID="${INPUT_ECOMMERCE_DEPLOYMENT_ID:-}" \
          INPUT_QDRANT_DEPLOYMENT_ID="${INPUT_QDRANT_DEPLOYMENT_ID:-}" \
          INPUT_PINECONE_DEPLOYMENT_ID="${INPUT_PINECONE_DEPLOYMENT_ID:-}" \
          INPUT_MILVUS_DEPLOYMENT_ID="${INPUT_MILVUS_DEPLOYMENT_ID:-}" \
          INPUT_WEAVIATE_DEPLOYMENT_ID="${INPUT_WEAVIATE_DEPLOYMENT_ID:-}" \
          SHOULD_RUN_PLATFORM_ADMIN="${should_run_platform_admin}" \
          SHOULD_RUN_ECOMMERCE="${should_run_ecommerce}" \
          SHOULD_RUN_VECTORS="${should_run_vectors}" \
          PLATFORM_BASE_URL="${platform_base_url}" \
          python3 - <<'PY'
          import json
          import os
          import sys

          payload = json.loads(os.environ.get("RESOLVED_JSON", "{}") or "{}")

          def choose(override, resolved):
              return override or (resolved or "")

          ecommerce_id = choose(os.environ.get("INPUT_ECOMMERCE_DEPLOYMENT_ID", ""), payload.get("ecommerceDeploymentId"))
          qdrant_id = choose(os.environ.get("INPUT_QDRANT_DEPLOYMENT_ID", ""), payload.get("qdrantDeploymentId"))
          pinecone_id = choose(os.environ.get("INPUT_PINECONE_DEPLOYMENT_ID", ""), payload.get("pineconeDeploymentId"))
          milvus_id = choose(os.environ.get("INPUT_MILVUS_DEPLOYMENT_ID", ""), payload.get("milvusDeploymentId"))
          weaviate_id = choose(os.environ.get("INPUT_WEAVIATE_DEPLOYMENT_ID", ""), payload.get("weaviateDeploymentId"))
          admin_target_id = choose(os.environ.get("INPUT_ADMIN_TARGET_DEPLOYMENT_ID", ""), ecommerce_id or qdrant_id)

          if os.environ.get("SHOULD_RUN_ECOMMERCE") == "true" and not ecommerce_id:
              print("Missing ecommerce deployment id after rollout resolution.", file=sys.stderr)
              sys.exit(1)
          if os.environ.get("SHOULD_RUN_VECTORS") == "true":
              missing = [name for name, value in {
                  "qdrant": qdrant_id,
                  "pinecone": pinecone_id,
                  "milvus": milvus_id,
                  "weaviate": weaviate_id,
              }.items() if not value]
              if missing:
                  print(f"Missing vector deployment ids after rollout resolution: {', '.join(missing)}", file=sys.stderr)
                  sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key, value in {
                  "platform_base_url": os.environ.get("PLATFORM_BASE_URL", ""),
                  "admin_target_deployment_id": admin_target_id,
                  "ecommerce_deployment_id": ecommerce_id,
                  "qdrant_deployment_id": qdrant_id,
                  "pinecone_deployment_id": pinecone_id,
                  "milvus_deployment_id": milvus_id,
                  "weaviate_deployment_id": weaviate_id,
              }.items():
                  handle.write(f"{key}<<__CTX__\n{value}\n__CTX__\n")
          PY

          {
            echo "tenant_primary_deployment_id=${tenant_primary_deployment_id}"
            echo "tenant_counterpart_deployment_id=${tenant_counterpart_deployment_id}"
          } >> "${GITHUB_OUTPUT}"

  code-regression:
    if: ${{ inputs.run_code_regression }}
    needs: resolve-context
    uses: ./.github/workflows/platform-code-regression.yml
    with:
      backend_tests: true
      product_tests: true
      infrastructure_tests: true
      ui_build: true
      shell_syntax_checks: true
    secrets: inherit

  platform-admin-smoke:
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.run_platform_admin_smoke) }}
    needs: [resolve-context]
    name: Platform admin smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run platform-admin live regression
        env:
          PLATFORM_BASE_URL: ${{ needs.resolve-context.outputs.platform_base_url }}
          ADMIN_TARGET_DEPLOYMENT_ID: ${{ needs.resolve-context.outputs.admin_target_deployment_id }}
          VERIFY_ASYNC_DELETE_SMOKE: true
          VERIFY_CANONICAL_ROLLOUT_READONLY: true
          VERIFY_CANONICAL_ROLLOUT_MUTATION: ${{ inputs.run_canonical_rollout_mutation }}
          CANONICAL_ROLLOUT_KEYS: ${{ inputs.canonical_rollout_keys }}
          PLATFORM_API_KEY: ${{ secrets.PLATFORM_API_KEY }}
          PLATFORM_LOGIN_EMAIL: ${{ secrets.PLATFORM_LOGIN_EMAIL }}
          PLATFORM_LOGIN_PASSWORD: ${{ secrets.PLATFORM_LOGIN_PASSWORD }}
        run: |
          bash scripts/verify-platform-admin-regression.sh

  ecommerce-vectorization:
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.run_ecommerce_vectorization) }}
    needs: [resolve-context]
    uses: ./.github/workflows/deployment-verification.yml
    with:
      deployment_id: ${{ needs.resolve-context.outputs.ecommerce_deployment_id }}
      verification_profile: ecommerce
      platform_base_url: ${{ needs.resolve-context.outputs.platform_base_url }}
      verify_write: true
    secrets: inherit

  qdrant-vector:
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.run_vector_deployments) }}
    needs: [resolve-context]
    uses: ./.github/workflows/deployment-verification.yml
    with:
      deployment_id: ${{ needs.resolve-context.outputs.qdrant_deployment_id }}
      verification_profile: vector
      platform_base_url: ${{ needs.resolve-context.outputs.platform_base_url }}
      verify_write: true
    secrets: inherit

  pinecone-vector:
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.run_vector_deployments) }}
    needs: [resolve-context]
    uses: ./.github/workflows/deployment-verification.yml
    with:
      deployment_id: ${{ needs.resolve-context.outputs.pinecone_deployment_id }}
      verification_profile: vector
      platform_base_url: ${{ needs.resolve-context.outputs.platform_base_url }}
      verify_write: true
    secrets: inherit

  milvus-vector:
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.run_vector_deployments) }}
    needs: [resolve-context]
    uses: ./.github/workflows/deployment-verification.yml
    with:
      deployment_id: ${{ needs.resolve-context.outputs.milvus_deployment_id }}
      verification_profile: vector
      platform_base_url: ${{ needs.resolve-context.outputs.platform_base_url }}
      verify_write: true
    secrets: inherit

  weaviate-vector:
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.run_vector_deployments) }}
    needs: [resolve-context]
    uses: ./.github/workflows/deployment-verification.yml
    with:
      deployment_id: ${{ needs.resolve-context.outputs.weaviate_deployment_id }}
      verification_profile: vector
      platform_base_url: ${{ needs.resolve-context.outputs.platform_base_url }}
      verify_write: true
    secrets: inherit

  tenant-shared-isolation:
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.run_tenant_isolation) }}
    needs: [resolve-context]
    uses: ./.github/workflows/deployment-verification.yml
    with:
      deployment_id: ${{ needs.resolve-context.outputs.tenant_primary_deployment_id }}
      verification_profile: vector
      platform_base_url: ${{ needs.resolve-context.outputs.platform_base_url }}
      verify_write: true
      vectorization_counterpart_deployment_id: ${{ needs.resolve-context.outputs.tenant_counterpart_deployment_id }}
    secrets: inherit

  managed-providers:
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.run_managed_provider_checks) }}
    needs: [resolve-context]
    uses: ./.github/workflows/managed-vector-provider-verification.yml
    with:
      run_pinecone: true
      run_qdrant: true
      run_zilliz: true
      run_weaviate: true
      cleanup_ephemeral_resources: true
      pinecone_create_ephemeral_index: true
      qdrant_create_ephemeral_db_key: true
      qdrant_create_ephemeral_cluster: false
      zilliz_create_ephemeral_cluster: false
    secrets: inherit
