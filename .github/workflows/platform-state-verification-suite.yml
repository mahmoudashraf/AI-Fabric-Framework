name: Platform State Verification Suite

run-name: Platform state verification suite

on:
  workflow_dispatch:
    inputs:
      platform_base_url:
        description: Platform public base URL.
        required: false
        type: string
        default: https://ai-fabric-framework-production-324f.up.railway.app
      run_platform_code_checks:
        description: Run platform backend tests and UI build.
        required: false
        type: boolean
        default: true
      run_marketplace_install_flow_checks:
        description: Create a fresh deployment from marketplace plugins, publish it, apply it, and verify live dataset-backed retrieval.
        required: false
        type: boolean
        default: false
      run_ecommerce_deployment_checks:
        description: Verify the current ecommerce deployment in read-only mode.
        required: false
        type: boolean
        default: true
      run_marketplace_runtime_checks:
        description: Verify the marketplace runtime canonical deployment in read-only mode.
        required: false
        type: boolean
        default: true
      run_vector_deployment_checks:
        description: Verify the current vector deployments in read-only mode.
        required: false
        type: boolean
        default: true
      run_managed_provider_checks:
        description: Verify the managed provider control planes and external Weaviate endpoint.
        required: false
        type: boolean
        default: true
      ensure_canonical_rollouts:
        description: Recreate missing or unready canonical rollout deployments before ecommerce/vector checks.
        required: false
        type: boolean
        default: true
      ecommerce_deployment_id:
        description: Ecommerce deployment id override. Leave empty to resolve from canonical rollout inventory.
        required: false
        type: string
        default: ''
      marketplace_deployment_id:
        description: Marketplace runtime deployment id override. Leave empty to resolve from canonical rollout inventory.
        required: false
        type: string
        default: ''
      qdrant_deployment_id:
        description: Qdrant deployment id override. Leave empty to resolve from canonical rollout inventory.
        required: false
        type: string
        default: ''
      pinecone_deployment_id:
        description: Current Pinecone vector deployment id override. Leave empty to resolve from canonical rollout inventory.
        required: false
        type: string
        default: ''
      milvus_deployment_id:
        description: Current Milvus/Zilliz vector deployment id override. Leave empty to resolve from canonical rollout inventory.
        required: false
        type: string
        default: ''
      weaviate_deployment_id:
        description: Current Weaviate vector deployment id override. Leave empty to resolve from canonical rollout inventory.
        required: false
        type: string
        default: ''

jobs:
  verify:
    name: Run sequential platform state verification
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      PLATFORM_BASE_URL: ${{ inputs.platform_base_url }}
      PLATFORM_API_KEY: ${{ secrets.PLATFORM_API_KEY }}
      PLATFORM_LOGIN_EMAIL: ${{ secrets.PLATFORM_LOGIN_EMAIL }}
      PLATFORM_LOGIN_PASSWORD: ${{ secrets.PLATFORM_LOGIN_PASSWORD }}
      APP_ADMIN_API_KEY: ${{ secrets.APP_ADMIN_API_KEY }}
      RUNTIME_TRUSTED_BACKEND_API_KEY: ${{ secrets.AI_FABRIC_RUNTIME_TRUSTED_BACKEND_API_KEY }}
      RUN_PLATFORM_CODE_CHECKS: ${{ inputs.run_platform_code_checks }}
      RUN_MARKETPLACE_INSTALL_FLOW_CHECKS: ${{ inputs.run_marketplace_install_flow_checks }}
      RUN_ECOMMERCE_DEPLOYMENT_CHECKS: ${{ inputs.run_ecommerce_deployment_checks }}
      RUN_MARKETPLACE_RUNTIME_CHECKS: ${{ inputs.run_marketplace_runtime_checks }}
      RUN_VECTOR_DEPLOYMENT_CHECKS: ${{ inputs.run_vector_deployment_checks }}
      RUN_MANAGED_PROVIDER_CHECKS: ${{ inputs.run_managed_provider_checks }}
      ENSURE_CANONICAL_ROLLOUTS: ${{ inputs.ensure_canonical_rollouts }}
      ECOMMERCE_DEPLOYMENT_ID: ${{ inputs.ecommerce_deployment_id }}
      MARKETPLACE_DEPLOYMENT_ID: ${{ inputs.marketplace_deployment_id }}
      QDRANT_DEPLOYMENT_ID: ${{ inputs.qdrant_deployment_id }}
      PINECONE_DEPLOYMENT_ID: ${{ inputs.pinecone_deployment_id }}
      MILVUS_DEPLOYMENT_ID: ${{ inputs.milvus_deployment_id }}
      WEAVIATE_DEPLOYMENT_ID: ${{ inputs.weaviate_deployment_id }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      QDRANT_CLOUD_MANAGEMENT_API_KEY: ${{ secrets.QDRANT_CLOUD_MANAGEMENT_API_KEY }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      ZILLIZ_CLOUD_API_KEY: ${{ secrets.ZILLIZ_CLOUD_API_KEY }}
      WEAVIATE_API_KEY: ${{ secrets.WEAVIATE_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: ${{ inputs.run_platform_code_checks }}
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node 20
        if: ${{ inputs.run_platform_code_checks }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Platfrom/ui/package-lock.json

      - name: Resolve rollout inventory
        id: resolve_rollouts
        if: ${{ inputs.run_ecommerce_deployment_checks || inputs.run_marketplace_runtime_checks || inputs.run_vector_deployment_checks }}
        run: |
          set -euo pipefail

          required_rollout_keys=()
          if [[ "${RUN_ECOMMERCE_DEPLOYMENT_CHECKS}" == "true" && -z "${ECOMMERCE_DEPLOYMENT_ID}" ]]; then
            required_rollout_keys+=("ecommerce")
          fi
          if [[ "${RUN_MARKETPLACE_RUNTIME_CHECKS}" == "true" && -z "${MARKETPLACE_DEPLOYMENT_ID}" ]]; then
            required_rollout_keys+=("marketplace")
          fi
          if [[ "${RUN_VECTOR_DEPLOYMENT_CHECKS}" == "true" ]]; then
            for vector_key in qdrant pinecone milvus weaviate; do
              override_name="$(printf '%s' "${vector_key}" | tr '[:lower:]' '[:upper:]')_DEPLOYMENT_ID"
              if [[ -z "${!override_name:-}" ]]; then
                required_rollout_keys+=("${vector_key}")
              fi
            done
          fi

          if [[ "${#required_rollout_keys[@]}" -eq 0 ]]; then
            {
              echo "ecommerce_deployment_id<<__OUTPUT__"
              echo "${ECOMMERCE_DEPLOYMENT_ID}"
              echo "__OUTPUT__"
              echo "marketplace_deployment_id<<__OUTPUT__"
              echo "${MARKETPLACE_DEPLOYMENT_ID}"
              echo "__OUTPUT__"
              echo "qdrant_deployment_id<<__OUTPUT__"
              echo "${QDRANT_DEPLOYMENT_ID}"
              echo "__OUTPUT__"
              echo "pinecone_deployment_id<<__OUTPUT__"
              echo "${PINECONE_DEPLOYMENT_ID}"
              echo "__OUTPUT__"
              echo "milvus_deployment_id<<__OUTPUT__"
              echo "${MILVUS_DEPLOYMENT_ID}"
              echo "__OUTPUT__"
              echo "weaviate_deployment_id<<__OUTPUT__"
              echo "${WEAVIATE_DEPLOYMENT_ID}"
              echo "__OUTPUT__"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          required_rollout_keys_csv="$(IFS=,; echo "${required_rollout_keys[*]}")"
          resolved_json="$(env \
            PLATFORM_BASE_URL="${PLATFORM_BASE_URL}" \
            PLATFORM_API_KEY="${PLATFORM_API_KEY}" \
            PLATFORM_LOGIN_EMAIL="${PLATFORM_LOGIN_EMAIL}" \
            PLATFORM_LOGIN_PASSWORD="${PLATFORM_LOGIN_PASSWORD}" \
            REQUIRED_ROLLOUT_KEYS="${required_rollout_keys_csv}" \
            ALLOW_ROLLOUT_MUTATION="${ENSURE_CANONICAL_ROLLOUTS}" \
            WAIT_FOR_VERIFICATION_READY=true \
            bash scripts/resolve-verification-rollouts.sh)"
          printf '%s\n' "${resolved_json}"

          resolved_file="$(mktemp)"
          printf '%s' "${resolved_json}" > "${resolved_file}"
          RESOLVED_FILE="${resolved_file}" \
          ECOMMERCE_DEPLOYMENT_ID="${ECOMMERCE_DEPLOYMENT_ID}" \
          MARKETPLACE_DEPLOYMENT_ID="${MARKETPLACE_DEPLOYMENT_ID}" \
          QDRANT_DEPLOYMENT_ID="${QDRANT_DEPLOYMENT_ID}" \
          PINECONE_DEPLOYMENT_ID="${PINECONE_DEPLOYMENT_ID}" \
          MILVUS_DEPLOYMENT_ID="${MILVUS_DEPLOYMENT_ID}" \
          WEAVIATE_DEPLOYMENT_ID="${WEAVIATE_DEPLOYMENT_ID}" \
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          import os

          with open(os.environ["RESOLVED_FILE"], "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          def choose(override_name, resolved_name):
              return os.environ.get(override_name) or payload.get(resolved_name) or ""

          outputs = {
              "ecommerce_deployment_id": choose("ECOMMERCE_DEPLOYMENT_ID", "ecommerceDeploymentId"),
              "marketplace_deployment_id": choose("MARKETPLACE_DEPLOYMENT_ID", "marketplaceDeploymentId"),
              "qdrant_deployment_id": choose("QDRANT_DEPLOYMENT_ID", "qdrantDeploymentId"),
              "pinecone_deployment_id": choose("PINECONE_DEPLOYMENT_ID", "pineconeDeploymentId"),
              "milvus_deployment_id": choose("MILVUS_DEPLOYMENT_ID", "milvusDeploymentId"),
              "weaviate_deployment_id": choose("WEAVIATE_DEPLOYMENT_ID", "weaviateDeploymentId"),
          }

          for key, value in outputs.items():
              print(f"{key}<<__OUTPUT__")
              print(value)
              print("__OUTPUT__")
          PY
          rm -f "${resolved_file}"

      - name: Platform backend tests
        if: ${{ inputs.run_platform_code_checks }}
        run: mvn -f Platfrom/backend/pom.xml test -DskipITs

      - name: ai-fabric-product tests
        if: ${{ inputs.run_platform_code_checks }}
        run: mvn -f ai-fabric-product/pom.xml test

      - name: Targeted infrastructure tests
        if: ${{ inputs.run_platform_code_checks }}
        run: >
          mvn -f ai-infrastructure-module/pom.xml
          -pl ai-infrastructure-data-sync,victor-databases/ai-infrastructure-vector-pinecone,victor-databases/ai-infrastructure-vector-qdrant,victor-databases/ai-infrastructure-vector-weaviate,victor-databases/ai-infrastructure-vector-milvus
          -am test -DskipITs

      - name: Platform UI build
        if: ${{ inputs.run_platform_code_checks }}
        run: |
          cd Platfrom/ui
          npm ci
          npm run build

      - name: Shell syntax checks
        if: ${{ inputs.run_platform_code_checks }}
        run: |
          bash -n scripts/verify-ecommerce-deployment.sh
          bash -n scripts/verify-vector-deployment.sh
          bash -n scripts/verify-managed-vector-providers.sh
          bash -n scripts/verify-platform-admin-regression.sh
          bash -n scripts/resolve-verification-rollouts.sh
          bash -n scripts/run-platform-deployment-verification.sh
          bash -n scripts/run-platform-state-verification-suite.sh

      - name: Verify ecommerce deployment
        if: ${{ inputs.run_ecommerce_deployment_checks }}
        env:
          RESOLVED_DEPLOYMENT_ID: ${{ steps.resolve_rollouts.outputs.ecommerce_deployment_id }}
        run: |
          set -euo pipefail
          deployment_id="${RESOLVED_DEPLOYMENT_ID:-${ECOMMERCE_DEPLOYMENT_ID}}"
          if [[ -z "${deployment_id}" ]]; then
            echo "Missing ecommerce deployment id after rollout resolution." >&2
            exit 1
          fi
          env \
            PLATFORM_BASE_URL="${PLATFORM_BASE_URL}" \
            PLATFORM_API_KEY="${PLATFORM_API_KEY}" \
            PLATFORM_LOGIN_EMAIL="${PLATFORM_LOGIN_EMAIL}" \
            PLATFORM_LOGIN_PASSWORD="${PLATFORM_LOGIN_PASSWORD}" \
            PLATFORM_DEPLOYMENT_ID="${deployment_id}" \
            VERIFICATION_PROFILE="ecommerce" \
            VERIFY_WRITE="false" \
            APP_ADMIN_API_KEY="${APP_ADMIN_API_KEY}" \
            RUNTIME_TRUSTED_BACKEND_API_KEY="${RUNTIME_TRUSTED_BACKEND_API_KEY}" \
            bash scripts/run-platform-deployment-verification.sh

      - name: Verify marketplace runtime deployment
        if: ${{ inputs.run_marketplace_runtime_checks }}
        env:
          RESOLVED_DEPLOYMENT_ID: ${{ steps.resolve_rollouts.outputs.marketplace_deployment_id }}
        run: |
          set -euo pipefail
          deployment_id="${RESOLVED_DEPLOYMENT_ID:-${MARKETPLACE_DEPLOYMENT_ID}}"
          if [[ -z "${deployment_id}" ]]; then
            echo "Missing marketplace runtime deployment id after rollout resolution." >&2
            exit 1
          fi
          env \
            PLATFORM_BASE_URL="${PLATFORM_BASE_URL}" \
            PLATFORM_API_KEY="${PLATFORM_API_KEY}" \
            PLATFORM_LOGIN_EMAIL="${PLATFORM_LOGIN_EMAIL}" \
            PLATFORM_LOGIN_PASSWORD="${PLATFORM_LOGIN_PASSWORD}" \
            PLATFORM_DEPLOYMENT_ID="${deployment_id}" \
            VERIFICATION_PROFILE="marketplace-runtime" \
            VERIFY_WRITE="false" \
            APP_ADMIN_API_KEY="${APP_ADMIN_API_KEY}" \
            RUNTIME_TRUSTED_BACKEND_API_KEY="${RUNTIME_TRUSTED_BACKEND_API_KEY}" \
            bash scripts/run-platform-deployment-verification.sh

      - name: Verify Qdrant deployment
        if: ${{ inputs.run_vector_deployment_checks }}
        env:
          RESOLVED_DEPLOYMENT_ID: ${{ steps.resolve_rollouts.outputs.qdrant_deployment_id }}
        run: |
          set -euo pipefail
          deployment_id="${RESOLVED_DEPLOYMENT_ID:-${QDRANT_DEPLOYMENT_ID}}"
          if [[ -z "${deployment_id}" ]]; then
            echo "Missing qdrant deployment id after rollout resolution." >&2
            exit 1
          fi
          env \
            PLATFORM_BASE_URL="${PLATFORM_BASE_URL}" \
            PLATFORM_API_KEY="${PLATFORM_API_KEY}" \
            PLATFORM_LOGIN_EMAIL="${PLATFORM_LOGIN_EMAIL}" \
            PLATFORM_LOGIN_PASSWORD="${PLATFORM_LOGIN_PASSWORD}" \
            PLATFORM_DEPLOYMENT_ID="${deployment_id}" \
            VERIFICATION_PROFILE="vector" \
            VERIFY_WRITE="false" \
            APP_ADMIN_API_KEY="${APP_ADMIN_API_KEY}" \
            RUNTIME_TRUSTED_BACKEND_API_KEY="${RUNTIME_TRUSTED_BACKEND_API_KEY}" \
            bash scripts/run-platform-deployment-verification.sh

      - name: Verify Pinecone deployment
        if: ${{ inputs.run_vector_deployment_checks }}
        env:
          RESOLVED_DEPLOYMENT_ID: ${{ steps.resolve_rollouts.outputs.pinecone_deployment_id }}
        run: |
          set -euo pipefail
          deployment_id="${RESOLVED_DEPLOYMENT_ID:-${PINECONE_DEPLOYMENT_ID}}"
          if [[ -z "${deployment_id}" ]]; then
            echo "Missing pinecone deployment id after rollout resolution." >&2
            exit 1
          fi
          env \
            PLATFORM_BASE_URL="${PLATFORM_BASE_URL}" \
            PLATFORM_API_KEY="${PLATFORM_API_KEY}" \
            PLATFORM_LOGIN_EMAIL="${PLATFORM_LOGIN_EMAIL}" \
            PLATFORM_LOGIN_PASSWORD="${PLATFORM_LOGIN_PASSWORD}" \
            PLATFORM_DEPLOYMENT_ID="${deployment_id}" \
            VERIFICATION_PROFILE="vector" \
            VERIFY_WRITE="false" \
            APP_ADMIN_API_KEY="${APP_ADMIN_API_KEY}" \
            RUNTIME_TRUSTED_BACKEND_API_KEY="${RUNTIME_TRUSTED_BACKEND_API_KEY}" \
            bash scripts/run-platform-deployment-verification.sh

      - name: Verify Milvus deployment
        if: ${{ inputs.run_vector_deployment_checks }}
        env:
          RESOLVED_DEPLOYMENT_ID: ${{ steps.resolve_rollouts.outputs.milvus_deployment_id }}
        run: |
          set -euo pipefail
          deployment_id="${RESOLVED_DEPLOYMENT_ID:-${MILVUS_DEPLOYMENT_ID}}"
          if [[ -z "${deployment_id}" ]]; then
            echo "Missing milvus deployment id after rollout resolution." >&2
            exit 1
          fi
          env \
            PLATFORM_BASE_URL="${PLATFORM_BASE_URL}" \
            PLATFORM_API_KEY="${PLATFORM_API_KEY}" \
            PLATFORM_LOGIN_EMAIL="${PLATFORM_LOGIN_EMAIL}" \
            PLATFORM_LOGIN_PASSWORD="${PLATFORM_LOGIN_PASSWORD}" \
            PLATFORM_DEPLOYMENT_ID="${deployment_id}" \
            VERIFICATION_PROFILE="vector" \
            VERIFY_WRITE="false" \
            APP_ADMIN_API_KEY="${APP_ADMIN_API_KEY}" \
            RUNTIME_TRUSTED_BACKEND_API_KEY="${RUNTIME_TRUSTED_BACKEND_API_KEY}" \
            bash scripts/run-platform-deployment-verification.sh

      - name: Verify Weaviate deployment
        if: ${{ inputs.run_vector_deployment_checks }}
        env:
          RESOLVED_DEPLOYMENT_ID: ${{ steps.resolve_rollouts.outputs.weaviate_deployment_id }}
        run: |
          set -euo pipefail
          deployment_id="${RESOLVED_DEPLOYMENT_ID:-${WEAVIATE_DEPLOYMENT_ID}}"
          if [[ -z "${deployment_id}" ]]; then
            echo "Missing weaviate deployment id after rollout resolution." >&2
            exit 1
          fi
          env \
            PLATFORM_BASE_URL="${PLATFORM_BASE_URL}" \
            PLATFORM_API_KEY="${PLATFORM_API_KEY}" \
            PLATFORM_LOGIN_EMAIL="${PLATFORM_LOGIN_EMAIL}" \
            PLATFORM_LOGIN_PASSWORD="${PLATFORM_LOGIN_PASSWORD}" \
            PLATFORM_DEPLOYMENT_ID="${deployment_id}" \
            VERIFICATION_PROFILE="vector" \
            VERIFY_WRITE="false" \
            APP_ADMIN_API_KEY="${APP_ADMIN_API_KEY}" \
            RUNTIME_TRUSTED_BACKEND_API_KEY="${RUNTIME_TRUSTED_BACKEND_API_KEY}" \
            bash scripts/run-platform-deployment-verification.sh

      - name: Managed vector provider verification
        if: ${{ inputs.run_managed_provider_checks }}
        run: bash scripts/verify-managed-vector-providers.sh
