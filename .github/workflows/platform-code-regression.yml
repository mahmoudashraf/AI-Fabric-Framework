name: Platform Code Regression

run-name: Platform code regression

on:
  workflow_call:
    inputs:
      backend_tests:
        description: Run platform backend tests.
        required: false
        type: boolean
        default: true
      product_tests:
        description: Run ai-fabric-product and platform product-service tests.
        required: false
        type: boolean
        default: true
      ui_build:
        description: Run platform UI install and build.
        required: false
        type: boolean
        default: true
      shell_syntax_checks:
        description: Validate hosted verification shell scripts with bash -n.
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      backend_tests:
        description: Run platform backend tests.
        required: false
        type: boolean
        default: true
      product_tests:
        description: Run ai-fabric-product and platform product-service tests.
        required: false
        type: boolean
        default: true
      ui_build:
        description: Run platform UI install and build.
        required: false
        type: boolean
        default: true
      shell_syntax_checks:
        description: Validate hosted verification shell scripts with bash -n.
        required: false
        type: boolean
        default: true
jobs:
  verify:
    name: Verify platform code regression
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      # docker-java 3.x otherwise defaults to API 1.32, rejected by newer engines.
      JAVA_TOOL_OPTIONS: -Dapi.version=1.44
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: ${{ inputs.backend_tests || inputs.product_tests }}
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node 20
        if: ${{ inputs.ui_build }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Platfrom/ui/package-lock.json

      - name: Run platform backend tests
        if: ${{ inputs.backend_tests }}
        run: |
          mvn -f Platfrom/backend/pom.xml test -DskipITs

      - name: Run ai-fabric-product tests
        if: ${{ inputs.product_tests }}
        run: |
          mvn -f ai-fabric-product/pom.xml test

      - name: Run AI Fabric relay tests
        if: ${{ inputs.product_tests }}
        run: |
          mvn -f ai-infrastructure-module/pom.xml -pl ai-fabric-relay -am test

      - name: Run AI Fabric relay packaged smoke
        if: ${{ inputs.product_tests }}
        run: |
          bash .github/scripts/smoke-p1-relay-local.sh

      - name: Run platform UI build
        if: ${{ inputs.ui_build }}
        run: |
          npm --prefix max-mode-widget ci
          cd Platfrom/ui
          npm ci
          npm run build

      - name: Verify configuration assistance and search comparisons
        if: ${{ inputs.ui_build }}
        working-directory: Platfrom/ui
        run: |
          npm run test:search-quality
          npm run test:conversation-autonomy
          node --test scripts/plugin-creator-document.test.mjs scripts/plugin-json-fidelity.test.mjs scripts/plugin-creator-requirements.test.mjs scripts/plugin-library-api.test.mjs

      - name: Verify customer authentication and session continuity
        if: ${{ inputs.ui_build }}
        working-directory: Platfrom/ui
        run: node --test scripts/customer-supabase-auth.test.mjs scripts/customer-auth-session-continuity.test.mjs

      - name: Install Chromium for UI browser regressions
        if: ${{ inputs.ui_build }}
        working-directory: Platfrom/ui
        run: npx playwright install --with-deps chromium

      - name: Verify configuration assistant browser journeys
        if: ${{ inputs.ui_build }}
        working-directory: Platfrom/ui
        env:
          ASSISTANT_EVIDENCE_DIR: ${{ runner.temp }}/configuration-assistant-browser
        run: node src/assistant/assistant.browser.mjs

      - name: Verify response settings and conversational autonomy controls
        if: ${{ inputs.ui_build }}
        working-directory: Platfrom/ui
        run: node scripts/brain-responses.browser.mjs

      - name: Verify customer authentication browser journeys
        if: ${{ inputs.ui_build }}
        working-directory: Platfrom/ui
        run: node scripts/customer-supabase-auth-ui-smoke.mjs

      - name: Validate hosted verification shell scripts
        if: ${{ inputs.shell_syntax_checks }}
        run: |
          bash .github/scripts/validate-platform-semantic-decision-source-guard.sh
          bash -n scripts/verify-ecommerce-deployment.sh
          bash -n scripts/verify-platform-admin-regression.sh
          bash -n scripts/resolve-verification-rollouts.sh
          bash -n scripts/run-platform-deployment-verification.sh
          bash -n scripts/run-platform-state-verification-suite.sh
          bash -n scripts/verify-vector-deployment.sh
          bash -n scripts/verify-managed-vector-providers.sh
          bash -n .github/scripts/smoke-p1-relay-local.sh

      - name: Upload configuration assistant browser evidence
        if: ${{ always() && inputs.ui_build }}
        uses: actions/upload-artifact@v4
        with:
          name: configuration-assistant-browser
          path: ${{ runner.temp }}/configuration-assistant-browser
          if-no-files-found: ignore
