name: Platform V2 Verification

run-name: Platform V2 verify

on:
  workflow_call:
    inputs:
      backend_tests:
        description: Run platform backend tests.
        required: false
        type: boolean
        default: true
      ui_build:
        description: Run platform UI install and build.
        required: false
        type: boolean
        default: true
      shell_syntax_checks:
        description: Validate verification shell scripts with bash -n.
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      backend_tests:
        description: Run platform backend tests.
        required: false
        type: boolean
        default: true
      ui_build:
        description: Run platform UI install and build.
        required: false
        type: boolean
        default: true
      shell_syntax_checks:
        description: Validate verification shell scripts with bash -n.
        required: false
        type: boolean
        default: true

jobs:
  verify:
    name: Verify Platform V2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: ${{ inputs.backend_tests }}
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node 20
        if: ${{ inputs.ui_build }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Platfrom/ui/package-lock.json

      - name: Run platform backend tests
        if: ${{ inputs.backend_tests }}
        run: |
          mvn -f Platfrom/backend/pom.xml test -DskipITs

      - name: Run platform UI build
        if: ${{ inputs.ui_build }}
        run: |
          cd Platfrom/ui
          npm ci
          npm run build

      - name: Validate verification shell scripts
        if: ${{ inputs.shell_syntax_checks }}
        run: |
          bash -n scripts/verify-ecommerce-deployment.sh
          bash -n scripts/resolve-verification-rollouts.sh
          bash -n scripts/verify-vector-deployment.sh
          bash -n scripts/verify-managed-vector-providers.sh
