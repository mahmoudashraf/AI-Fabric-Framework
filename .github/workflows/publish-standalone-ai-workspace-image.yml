name: Publish Standalone AI Workspace Image

on:
  push:
    branches:
      - Platform-V11
    paths:
      - ".github/workflows/publish-standalone-ai-workspace-image.yml"
      - "workspace-apps/standalone-ai-workspace/**"
      - "!workspace-apps/standalone-ai-workspace/*.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: standalone-ai-workspace-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: loomai-standalone-ai-workspace

jobs:
  changes:
    name: Resolve frontend image scope
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.scope.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          image=false
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/publish-standalone-ai-workspace-image.yml|workspace-apps/standalone-ai-workspace/Dockerfile|workspace-apps/standalone-ai-workspace/server.mjs|workspace-apps/standalone-ai-workspace/index.html|workspace-apps/standalone-ai-workspace/package*.json|workspace-apps/standalone-ai-workspace/src/*|workspace-apps/standalone-ai-workspace/public/*|workspace-apps/standalone-ai-workspace/*config*)
                image=true
                ;;
            esac
          done < <(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")
          echo "image=$image" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify standalone workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workspace-apps/standalone-ai-workspace
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workspace-apps/standalone-ai-workspace/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify contracts and browser behavior
        run: npm run typecheck && npm run build && npm test && npm run test:browser

  publish:
    name: Publish standalone workspace image
    needs: [changes, verify]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture build time
        id: build
        shell: bash
        run: echo "time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and publish immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workspace-apps/standalone-ai-workspace/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.build.outputs.time }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}

      - name: Record immutable image identity
        shell: bash
        run: |
          {
            echo "## Standalone AI Workspace image"
            echo
            echo "- Image: \`${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}:${GITHUB_SHA}\`"
            echo "- Digest: \`${{ steps.image.outputs.digest }}\`"
            echo "- Source: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
