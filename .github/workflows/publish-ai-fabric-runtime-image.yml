name: Publish AI Fabric Runtime Image

on:
  push:
    branches:
      - Platform-V11
    paths:
      - ".github/workflows/publish-ai-fabric-runtime-image.yml"
      - "ai-infrastructure-module/ai-fabric-runtime/**"
      - "ai-infrastructure-module/pom.xml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ai-fabric-runtime-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ai-fabric-runtime

jobs:
  publish:
    name: Build and publish immutable runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture build time
        id: build
        shell: bash
        run: echo "time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and publish runtime image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ai-infrastructure-module/ai-fabric-runtime/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.build.outputs.time }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            SOURCE_BUILD_TIME=${{ steps.build.outputs.time }}

      - name: Record immutable image identity
        shell: bash
        run: |
          {
            echo "## AI Fabric runtime image"
            echo
            echo "- Image: \`${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}\`"
            echo "- Digest: \`${{ steps.image.outputs.digest }}\`"
            echo "- Source: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
