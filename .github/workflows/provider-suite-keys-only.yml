name: Provider Suite (Keys Only)

on:
  workflow_dispatch:
    inputs:
      openai_api_key:
        description: 'OpenAI API Key (LLM)'
        required: false
        type: string
      pinecone_api_key:
        description: 'Pinecone API Key (Vector DB)'
        required: false
        type: string
      cohere_api_key:
        description: 'Cohere API Key (LLM)'
        required: false
        type: string
      anthropic_api_key:
        description: 'Anthropic API Key (LLM)'
        required: false
        type: string
      gemini_api_key:
        description: 'Gemini API Key (LLM)'
        required: false
        type: string
      logging_level:
        description: 'Maven logging level'
        required: false
        default: 'normal'
        type: choice
        options:
          - quiet
          - error
          - normal
          - verbose
          - debug
      storage_strategy:
        description: 'Storage strategy for AISearchableEntity'
        required: false
        default: 'SINGLE_TABLE'
        type: choice
        options:
          - SINGLE_TABLE
          - PER_TYPE_TABLE
          - CUSTOM
      persistence_database:
        description: 'Persistence database'
        required: false
        default: 'h2'
        type: choice
        options:
          - h2
          - postgresql

jobs:
  provider-suite:
    name: Provider Suite (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: openai-onnx-pinecone
            llm: openai
            embedding: onnx
            vector_db: pinecone
            spring_profiles: real-api-test
            use_testcontainers: false
            requires_openai: true
            requires_cohere: false
            requires_anthropic: false
            requires_gemini: false
            requires_pinecone: true
          - name: cohere-onnx-qdrant
            llm: cohere
            embedding: onnx
            vector_db: qdrant
            spring_profiles: real-api-test,testcontainers
            use_testcontainers: true
            requires_openai: false
            requires_cohere: true
            requires_anthropic: false
            requires_gemini: false
            requires_pinecone: false
          - name: anthropic-onnx-milvus
            llm: anthropic
            embedding: onnx
            vector_db: milvus
            spring_profiles: real-api-test,testcontainers
            use_testcontainers: true
            requires_openai: false
            requires_cohere: false
            requires_anthropic: true
            requires_gemini: false
            requires_pinecone: false
          - name: gemini-onnx-weaviate
            llm: gemini
            embedding: onnx
            vector_db: weaviate
            spring_profiles: real-api-test,testcontainers
            use_testcontainers: true
            requires_openai: false
            requires_cohere: false
            requires_anthropic: false
            requires_gemini: true
            requires_pinecone: false
          - name: openai-onnx-lucene
            llm: openai
            embedding: onnx
            vector_db: lucene
            spring_profiles: real-api-test
            use_testcontainers: false
            requires_openai: true
            requires_cohere: false
            requires_anthropic: false
            requires_gemini: false
            requires_pinecone: false

    if: >-
      ${{
        (!matrix.requires_openai || github.event.inputs.openai_api_key != '' || secrets.OPENAI_API_KEY != '') &&
        (!matrix.requires_cohere || github.event.inputs.cohere_api_key != '' || secrets.COHERE_API_KEY != '') &&
        (!matrix.requires_anthropic || github.event.inputs.anthropic_api_key != '' || secrets.ANTHROPIC_API_KEY != '') &&
        (!matrix.requires_gemini || github.event.inputs.gemini_api_key != '' || secrets.GEMINI_API_KEY != '') &&
        (!matrix.requires_pinecone || github.event.inputs.pinecone_api_key != '' || secrets.PINECONE_API_KEY != '')
      }}

    env:
      MAVEN_LOGGING_LEVEL: ${{ github.event.inputs.logging_level || 'normal' }}
      AI_INFRASTRUCTURE_PERSISTENCE_DATABASE: ${{ github.event.inputs.persistence_database || 'h2' }}
      AI_INFRASTRUCTURE_STORAGE_STRATEGY: ${{ github.event.inputs.storage_strategy || 'SINGLE_TABLE' }}

      # Prefer workflow_dispatch inputs, fall back to repo secrets.
      OPENAI_API_KEY: ${{ github.event.inputs.openai_api_key || secrets.OPENAI_API_KEY }}
      PINECONE_API_KEY: ${{ github.event.inputs.pinecone_api_key || secrets.PINECONE_API_KEY }}
      COHERE_API_KEY: ${{ github.event.inputs.cohere_api_key || secrets.COHERE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ github.event.inputs.anthropic_api_key || secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ github.event.inputs.gemini_api_key || secrets.GEMINI_API_KEY }}

      # Pinecone host/index are fixed defaults; override via repo variables if needed.
      PINECONE_INDEX_NAME: ${{ vars.PINECONE_INDEX_NAME != '' && vars.PINECONE_INDEX_NAME || 'ai-fabric' }}
      PINECONE_API_HOST: ${{ vars.PINECONE_API_HOST != '' && vars.PINECONE_API_HOST || 'https://ai-fabric-pwkuyn5.svc.aped-4627-b74a.pinecone.io' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # workflow_dispatch inputs are NOT treated as secrets by GitHub.
      # Mask them explicitly to avoid leaking API keys in logs.
      - name: Mask provider API keys
        if: always()
        run: |
          [ -n "${{ github.event.inputs.openai_api_key }}" ] && echo "::add-mask::${{ github.event.inputs.openai_api_key }}" || true
          [ -n "${{ github.event.inputs.pinecone_api_key }}" ] && echo "::add-mask::${{ github.event.inputs.pinecone_api_key }}" || true
          [ -n "${{ github.event.inputs.cohere_api_key }}" ] && echo "::add-mask::${{ github.event.inputs.cohere_api_key }}" || true
          [ -n "${{ github.event.inputs.anthropic_api_key }}" ] && echo "::add-mask::${{ github.event.inputs.anthropic_api_key }}" || true
          [ -n "${{ github.event.inputs.gemini_api_key }}" ] && echo "::add-mask::${{ github.event.inputs.gemini_api_key }}" || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Docker is available
        run: |
          docker --version
          docker info | head -5

      - name: Build AI Infrastructure Module (skip tests)
        run: |
          cd ai-infrastructure-module
          mvn install -DskipTests -B -V

      - name: Run suite (${{ matrix.llm }} + ${{ matrix.embedding }} + ${{ matrix.vector_db }})
        run: |
          cd ai-infrastructure-module/integration-Testing/integration-tests
          export SPRING_PROFILES_ACTIVE="${{ matrix.spring_profiles }}"
          if [ "${{ matrix.vector_db }}" = "pinecone" ]; then
            export AI_PROVIDERS_PINECONE_ENABLED="true"
            export AI_PROVIDERS_PINECONE_API_KEY="${PINECONE_API_KEY}"
            export AI_PROVIDERS_PINECONE_INDEX_NAME="${PINECONE_INDEX_NAME}"
            export AI_PROVIDERS_PINECONE_API_HOST="${PINECONE_API_HOST}"
          else
            export AI_PROVIDERS_PINECONE_ENABLED="false"
          fi
          bash run-provider-matrix-tests.sh "${{ matrix.llm }}:${{ matrix.embedding }}:${{ matrix.vector_db }}:${AI_INFRASTRUCTURE_STORAGE_STRATEGY}" "" "all"
