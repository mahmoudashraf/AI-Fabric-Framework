name: Publish Deployment Operations Service

on:
  push:
    branches: [Platform-V11]
    paths:
      - ".github/workflows/publish-deployment-operations-service.yml"
      - "product-services/deployment-operations-service/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deployment-operations-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify service independently of Platform
        run: mvn -B -ntp -f product-services/deployment-operations-service/pom.xml verify
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable service image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: product-services/deployment-operations-service
          file: product-services/deployment-operations-service/deploy/container/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/loomai-deployment-operations-service:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=loomai-deployment-operations-service
          cache-to: type=gha,mode=max,scope=loomai-deployment-operations-service
      - name: Record exact image identity
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/loomai-deployment-operations-service
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '## Deployment operations service\n\n- Image: `%s@%s`\n- Source: `%s`\n' "$IMAGE" "$DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
