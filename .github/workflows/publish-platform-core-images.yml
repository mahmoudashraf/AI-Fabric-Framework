name: Publish Platform Core Images

on:
  push:
    branches:
      - Platform-V11
    paths:
      - ".github/workflows/publish-platform-core-images.yml"
      - "Platfrom/backend/**"
      - "Platfrom/ui/**"
      - "ai-fabric-product/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: platform-core-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Platform backend
            image: loomai-platform-backend
            dockerfile: Platfrom/backend/deploy/railway/Dockerfile
          - name: Platform UI
            image: loomai-platform-ui
            dockerfile: Platfrom/ui/deploy/railway/Dockerfile
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture build time
        id: build
        shell: bash
        run: echo "time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and publish immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.build.outputs.time }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Record immutable image identity
        shell: bash
        run: |
          {
            echo "## ${{ matrix.name }} image"
            echo
            echo "- Image: \`${REGISTRY}/${{ github.repository_owner }}/${{ matrix.image }}:${GITHUB_SHA}\`"
            echo "- Digest: \`${{ steps.image.outputs.digest }}\`"
            echo "- Source: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
