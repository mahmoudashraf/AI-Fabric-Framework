openapi: 3.0.3
info:
  title: Fictional catalogue qualification API
  version: 1.0.0
servers:
  - url: https://catalogue.example.invalid
paths:
  /v1/records:
    get:
      operationId: search_records
      summary: Search current records
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        '200':
          description: Current records
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
  /v1/enquiries:
    post:
      operationId: register_interest
      summary: Register a confirmed enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recordId, email]
              properties:
                recordId:
                  type: string
                email:
                  type: string
                note:
                  type: string
      responses:
        '201':
          description: Enquiry receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  receiptId:
                    type: string
                  status:
                    type: string
