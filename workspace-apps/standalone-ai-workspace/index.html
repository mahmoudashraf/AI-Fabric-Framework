<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>LoomAI Engage</title>
  </head>
  <body>
    <main id="shell" aria-live="polite">
      <h1 id="app-heading" class="visually-hidden">LoomAI Engage</h1>
      <section class="status-panel" id="status-panel">
        <div class="brand-mark" aria-hidden="true">L</div>
        <p class="eyebrow">LOOMAI ENGAGE</p>
        <h2 id="status-title">Connecting your AI workspace</h2>
        <p id="status-copy">Resolving this app and its assigned deployment.</p>
        <div class="spinner" id="spinner" aria-hidden="true"></div>
        <button id="retry-button" class="button secondary hidden" type="button">Try again</button>
      </section>
    </main>

    <dialog id="auth-dialog" aria-labelledby="auth-title">
      <form id="auth-form" method="dialog">
        <button id="auth-close" class="icon-button" type="button" aria-label="Close sign in">×</button>
        <p class="eyebrow">SECURE ACCESS</p>
        <h2 id="auth-title">Sign in to continue</h2>
        <p class="auth-copy">Your identity is verified by this business's configured provider.</p>
        <label>Email<input id="auth-email" name="email" type="email" autocomplete="email" required /></label>
        <label id="password-field">Password<input id="auth-password" name="password" type="password" autocomplete="current-password" /></label>
        <p id="auth-error" class="error hidden" role="alert"></p>
        <div class="auth-actions">
          <button id="password-sign-in" class="button primary" type="submit">Sign in</button>
          <button id="magic-link" class="button secondary hidden" type="button">Email me a sign-in link</button>
        </div>
      </form>
    </dialog>

    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
