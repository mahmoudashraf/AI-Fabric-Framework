function navigate(screen){state.screen=screen;state.drawer=false;state.sourceView=false;document.getElementById('toast').hidden=true;render()}
document.addEventListener('click',event=>{const target=event.target.closest('[data-screen],[data-action],[data-step],[data-install-step],[data-filter],[data-plugin],[data-source]');if(!target)return;
if(target.dataset.screen){navigate(target.dataset.screen);return}if(target.dataset.step!==undefined){state.step=Number(target.dataset.step);state.sourceView=false;render();return}if(target.dataset.installStep!==undefined){state.installStep=Number(target.dataset.installStep);render();return}if(target.dataset.filter){state.filter=target.dataset.filter;render();return}if(target.dataset.plugin){state.selected=target.dataset.plugin;state.drawer=true;render();return}if(target.dataset.source){state.form.source=target.dataset.source;render();return}
const action=target.dataset.action;switch(action){case'choose':case'author':case'library':navigate(action);break;case'close':state.drawer=false;render();break;case'setup':state.installStep=0;state.tested=false;navigate('install');break;case'clear':state.search='';render();break;case'source':state.sourceView=!state.sourceView;render();break;case'next':state.step=Math.min(5,state.step+1);state.sourceView=false;render();break;case'prev':state.step=Math.max(0,state.step-1);state.sourceView=false;render();break;case'save-draft':notify('Design preview only: your definition is retained in memory. Nothing was saved to Platform.');break;case'save-version':state.saved=true;navigate('library');notify('Design preview only: reusable version 1.0.0 is shown. No Brain was changed.');break;case'use-private':state.selected='private';state.installStep=0;navigate('install');break;case'install-next':state.installStep=Math.min(2,state.installStep+1);render();break;case'install-prev':state.installStep=Math.max(0,state.installStep-1);render();break;case'test':state.tested=true;render();break;case'add-to-brain':state.added=true;navigate('choose');notify('Design preview only: shown as added to the Brain draft. A real install would use the existing save/compile API.');break;case'advanced-info':notify('Proposed advanced path: inspect the supported source contract. New protocols require a real adapter; this is not arbitrary code upload.');break;case'notification-info':notify('Notifications need a qualified webhook verification and reconciliation contract. A URL alone cannot enable them.');break;case'release-info':notify('The existing Updates page remains the only publish/apply path. No release is created by this mockup.');break;case'env-info':notify('This proposal retains the existing environment controls. Connection values must resolve for the selected authorized target.');break;case'other-library':notify('Illustrative library row. The vehicle plugin is the editable example in this review.');break;case'draft-library':state.step=0;navigate('author');notify('The creator shows the fictional vehicle integration as its working example.');break;case'select-library':notify('Selected: '+state.form.name+'. Edit its definition or configure it in a Brain.');break;default:notify('The rest of Console stays unchanged. Only the proposed plugin journey is interactive here.')}});
document.addEventListener('input',event=>{const target=event.target;if(target.id==='search'){state.search=target.value;const start=target.selectionStart;render();const input=document.getElementById('search');input.focus();input.setSelectionRange(start,start);return}const key=target.dataset.field;if(key){state.form[key]=target.value;const name=document.getElementById('preview-name'),purpose=document.getElementById('preview-purpose');if(name)name.textContent=state.form.name;if(purpose)purpose.textContent=state.form.purpose}});
document.addEventListener('change',event=>{if(event.target.id==='demo'){state.demo=event.target.checked;render()}});
document.getElementById('theme').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';document.getElementById('theme').textContent=dark?'Dark mode':'Light mode'});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.drawer){state.drawer=false;render()}});
render();
</script>
</body>
</html>
