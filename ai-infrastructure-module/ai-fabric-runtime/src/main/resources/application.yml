server:
  port: ${PORT:8097}
  forward-headers-strategy: framework

spring:
  application:
    name: ai-fabric-runtime
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:classpath:ai-entity-config.yml}
  datasource:
    url: jdbc:h2:file:./data/ai-fabric-runtime.db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/runtime-migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  quartz:
    auto-startup: ${LOOMAI_SMART_BRAIN_ENABLED:false}
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 20000
      org.quartz.jobStore.misfireThreshold: 60000

ai:
  enabled: true

  # Demos/tests can opt in to allow-all policy hooks (do not use in production).
  fabric:
    runtime:
      indexing:
        rebuild-incompatible-generated-state: ${AI_FABRIC_RUNTIME_REBUILD_INCOMPATIBLE_GENERATED_STATE:false}
      auth:
        ingress:
          mode: ${AI_FABRIC_RUNTIME_AUTH_INGRESS_MODE:VERIFIED_CONTEXT_REQUIRED}
          reject-conflicting-request-identity: ${AI_FABRIC_RUNTIME_REJECT_CONFLICTING_REQUEST_IDENTITY:true}
          reject-request-identity-when-verified-context-present: ${AI_FABRIC_RUNTIME_REJECT_REQUEST_IDENTITY_WHEN_VERIFIED_CONTEXT_PRESENT:true}
          accepted-issuers: ${AI_FABRIC_RUNTIME_AUTH_ACCEPTED_ISSUERS:}
          accepted-audiences: ${AI_FABRIC_RUNTIME_AUTH_ACCEPTED_AUDIENCES:}
          trusted-backend:
            api-key-header: ${AI_FABRIC_RUNTIME_TRUSTED_BACKEND_API_KEY_HEADER:X-AIFABRIC-RUNTIME-API-KEY}
            api-key-value: ${AI_FABRIC_RUNTIME_TRUSTED_BACKEND_API_KEY:}
          private-assertions:
            authorization-header: ${AI_FABRIC_RUNTIME_PRIVATE_AUTHORIZATION_HEADER:X-AIFABRIC-RUNTIME-AUTHORIZATION}
            token-scheme: ${AI_FABRIC_RUNTIME_PRIVATE_TOKEN_SCHEME:Bearer}
            signing-key: ${AI_FABRIC_RUNTIME_PRIVATE_ASSERTION_SIGNING_KEY:}
        public-tokens:
          authorization-header: ${AI_FABRIC_RUNTIME_PUBLIC_AUTHORIZATION_HEADER:Authorization}
          token-scheme: ${AI_FABRIC_RUNTIME_PUBLIC_TOKEN_SCHEME:Bearer}
          signing-key: ${AI_FABRIC_RUNTIME_PUBLIC_TOKEN_SIGNING_KEY:}
          issuer: ${AI_FABRIC_RUNTIME_PUBLIC_TOKEN_ISSUER:runtime-public-bootstrap}
          accepted-issuers: ${AI_FABRIC_RUNTIME_PUBLIC_TOKEN_ACCEPTED_ISSUERS:}
          accepted-audiences: ${AI_FABRIC_RUNTIME_PUBLIC_TOKEN_ACCEPTED_AUDIENCES:}
          default-audience: ${AI_FABRIC_RUNTIME_PUBLIC_TOKEN_DEFAULT_AUDIENCE:}
          ttl-seconds: ${AI_FABRIC_RUNTIME_PUBLIC_TOKEN_TTL_SECONDS:900}
          bootstrap:
            enabled: ${AI_FABRIC_RUNTIME_PUBLIC_BOOTSTRAP_ENABLED:false}
            allow-missing-origin: ${AI_FABRIC_RUNTIME_PUBLIC_BOOTSTRAP_ALLOW_MISSING_ORIGIN:false}
            allowed-origins: ${AI_FABRIC_RUNTIME_PUBLIC_BOOTSTRAP_ALLOWED_ORIGINS:}
            max-requests-per-window: ${AI_FABRIC_RUNTIME_PUBLIC_BOOTSTRAP_MAX_REQUESTS_PER_WINDOW:30}
            rate-limit-window-seconds: ${AI_FABRIC_RUNTIME_PUBLIC_BOOTSTRAP_RATE_LIMIT_WINDOW_SECONDS:60}
          defaults:
            deployment-id: ${AI_FABRIC_RUNTIME_DEPLOYMENT_ID:}
            customer-id: ${AI_FABRIC_RUNTIME_CUSTOMER_ID:}
            tenant-id: ${AI_FABRIC_RUNTIME_TENANT_ID:}
      authz:
        # Remote access control for runtime product deployments.
        # Default base URL inherits ACTIONS_CONNECTOR_BASE_URL so runtime -> REST connector -> customer authz is easy to wire.
        mode: ${AI_FABRIC_RUNTIME_AUTHZ_MODE:REMOTE_HTTP} # REMOTE_HTTP | ALLOW_VERIFIED | DENY_ALL
        remote:
          base-url: ${AUTHZ_BASE_URL:${ACTIONS_CONNECTOR_BASE_URL:}}
          path: ${AUTHZ_PATH:/api/authz/check}
          connect-timeout-ms: ${AUTHZ_CONNECT_TIMEOUT_MS:500}
          timeout-ms: ${AUTHZ_TIMEOUT_MS:1500}
          outbound-auth:
            type: ${AUTHZ_OUTBOUND_AUTH_TYPE:INHERIT_ACTIONS_API_KEY} # NONE | API_KEY | INHERIT_ACTIONS_API_KEY
            api-key-header: ${AUTHZ_API_KEY_HEADER:${ACTIONS_CONNECTOR_API_KEY_HEADER:X-AIFABRIC-API-KEY}}
            api-key-value: ${AUTHZ_API_KEY:${ACTIONS_CONNECTOR_API_KEY:}}
  chat:
    enabled: true
    window-size: 12
    max-context-chars: 8000
    auto-create-sessions: true

  # Default OFF for privacy/noise in dev. Enable if you want analytics/auditing.
  intent-history:
    enabled: false

  providers:
    llm-provider: ${AI_PROVIDERS_LLM_PROVIDER:openai}
    embedding-provider: ${AI_PROVIDERS_EMBEDDING_PROVIDER:openai}
    openai:
      enabled: ${OPENAI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      # Lucene supports up to 1024 dimensions.
      embedding-dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:512}
      timeout: 45

  service:
    features:
      enable-generation: ${AI_SERVICE_FEATURES_ENABLE_GENERATION:${OPENAI_ENABLED:false}}
      enable-embeddings: ${AI_SERVICE_FEATURES_ENABLE_EMBEDDINGS:${OPENAI_ENABLED:false}}
      enable-search: true
      enable-rag: true

  vector-db:
    type: ${AI_VECTOR_DB_TYPE:lucene}
    lucene:
      # Include embedding dimensions in the path to avoid mixing different vector sizes in one Lucene index.
      index-path: ./data/lucene-vector-index-${AI_VECTOR_DB_LUCENE_VECTOR_DIMENSION:${OPENAI_EMBEDDING_DIMENSIONS:512}}
      vector-dimension: ${AI_VECTOR_DB_LUCENE_VECTOR_DIMENSION:${OPENAI_EMBEDDING_DIMENSIONS:512}}

  # Push ingestion into the managed vector DB (requires embeddings enabled + vector DB configured).
  data-sync:
    enabled: true

  execution:
    enabled: ${AI_EXECUTION_ENABLED:true}
    output-finalization:
      max-attempts: ${AI_EXECUTION_OUTPUT_FINALIZATION_MAX_ATTEMPTS:1}
    specialist-chains:
      enabled: ${AI_EXECUTION_SPECIALIST_CHAINS_ENABLED:false}
      durable-enabled: ${AI_EXECUTION_SPECIALIST_CHAINS_DURABLE_ENABLED:false}
      allow-ephemeral: false
      initialize-schema: false
      max-active: ${AI_EXECUTION_SPECIALIST_CHAINS_MAX_ACTIVE:250}
      max-duration: ${AI_EXECUTION_SPECIALIST_CHAINS_MAX_DURATION:PT75S}
      max-manager-decisions: ${AI_EXECUTION_SPECIALIST_CHAINS_MAX_MANAGER_DECISIONS:4}
      max-worker-invocations: ${AI_EXECUTION_SPECIALIST_CHAINS_MAX_WORKER_INVOCATIONS:2}
      max-parallel-workers: ${AI_EXECUTION_SPECIALIST_CHAINS_MAX_PARALLEL_WORKERS:2}
      max-invocations-per-target: 1
      max-projected-result-characters: 8000
      max-directive-corrections: ${AI_EXECUTION_SPECIALIST_CHAINS_MAX_DIRECTIVE_CORRECTIONS:3}
      lease-duration: PT2M
      recovery-interval: PT30S
      recovery-batch-size: 50
      max-attempts: 3
      cleanup-enabled: true
      retention: P30D
      encryption-secret: ${AI_SPECIALIST_CHAIN_ENCRYPTION_SECRET:}
      fingerprint-secret: ${AI_SPECIALIST_CHAIN_FINGERPRINT_SECRET:}
    manifests:
      enabled: ${AI_EXECUTION_MANIFESTS_ENABLED:true}
      fail-fast: true
      max-manifest-bytes: 65536
      max-resource-bytes: 65536
      locations: ${AI_EXECUTION_MANIFEST_LOCATIONS:classpath*:ai-specialists/*.yml,classpath*:ai-specialists/*.yaml,classpath*:ai-specialists/*.json}
    capabilities:
      registered-vector-spaces:
        - document
      allowed-actions: []
    async:
      repository: ${AI_EXECUTION_ASYNC_REPOSITORY:IN_MEMORY}
      initialize-schema: ${AI_EXECUTION_ASYNC_INITIALIZE_SCHEMA:false}
      encryption-secret: ${AI_EXECUTION_ASYNC_ENCRYPTION_SECRET:}
      fingerprint-secret: ${AI_EXECUTION_ASYNC_FINGERPRINT_SECRET:}
    receipts:
      enabled: ${AI_EXECUTION_RECEIPTS_ENABLED:false}
      repository: JDBC
      initialize-schema: false
      allow-in-production: true
      ttl: ${AI_EXECUTION_RECEIPTS_TTL:PT25H}
      encryption-secret: ${AI_ACTION_RECEIPT_ENCRYPTION_SECRET:}
      fingerprint-secret: ${AI_ACTION_RECEIPT_FINGERPRINT_SECRET:}
    reviews:
      enabled: ${AI_EXECUTION_REVIEWS_ENABLED:false}
      repository: JDBC
      initialize-schema: false
      allow-in-production: true
      encryption-secret: ${AI_REVIEW_ENCRYPTION_SECRET:}
      fingerprint-secret: ${AI_REVIEW_FINGERPRINT_SECRET:}
    input-waits:
      enabled: false
    plans:
      enabled: false
      parallel-enabled: false
    conversation-managers:
      enabled: false

  orchestration:
    strict-mode-routing: true
    modes:
      conversational:
        actions-enabled: false
        retrieval-enabled: false
        retrieval-allowlist-required: false
        vector-space-selection-required: false
        knowledge-base-overview-enabled: false
        information-mode: LLM_DRIVEN
      resolver:
        actions-enabled: false
        retrieval-enabled: false
        retrieval-allowlist-required: false
        vector-space-selection-required: false
        information-mode: LLM_DRIVEN
      navigator_deep:
        read-action-resolution:
          allowed-read-actions: ${LOOMAI_RUNTIME_READ_ACTION_RESOLUTION_ALLOWED_ACTIONS:}
      executor:
        read-action-resolution:
          allowed-read-actions: ${LOOMAI_RUNTIME_READ_ACTION_RESOLUTION_ALLOWED_ACTIONS:}
      cart_assistant:
        read-action-resolution:
          allowed-read-actions: ${LOOMAI_RUNTIME_READ_ACTION_RESOLUTION_ALLOWED_ACTIONS:}
      resolver_assistant:
        read-action-resolution:
          allowed-read-actions: ${LOOMAI_RUNTIME_READ_ACTION_RESOLUTION_ALLOWED_ACTIONS:}
      thinker:
        read-action-resolution:
          allowed-read-actions: ${LOOMAI_RUNTIME_READ_ACTION_RESOLUTION_ALLOWED_ACTIONS:}
      deployment_knowledge:
        actions-enabled: false
        retrieval-enabled: true
        retrieval-allowlist-required: true
        vector-space-selection-required: false
        information-mode: DETERMINISTIC_RAG_GENERATE
        rag:
          fanout-enabled: false
          max-spaces: 1
          top-k-per-space: 4
          similarity-threshold: 0.45
          max-documents-returned-to-client: 4
          max-documents-used-for-context: 4
          max-context-chars: 6000
          retrieval-vector-spaces-allowlist:
            - document

  # External retrieval connector is opt-in (documents-only).
  retrieval:
    connector:
      enabled: false

  # Connector-backed actions are opt-in: mount an action contract file or override AI_ACTIONS_CATALOG_PATH.
  actions:
    sources:
      - path: ${AI_ACTIONS_CATALOG_PATH:file:/config/ai-actions.yml}
        optional: true
    connector:
      base-url: ${ACTIONS_CONNECTOR_BASE_URL:}
      api-key:
        value: ${ACTIONS_CONNECTOR_API_KEY:}

management:
  health:
    ai-fabric:
      vector:
        # Runtime aggregate health should answer whether the service is alive/ready to serve.
        # Vector provider capability diagnostics remain available through the private admin endpoints.
        enabled: ${MANAGEMENT_HEALTH_AI_FABRIC_VECTOR_ENABLED:false}
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.ai.fabric.runtime: INFO
    ai.fabric: INFO

app:
  specialists:
    deployment-knowledge:
      enabled: ${LOOMAI_DEPLOYMENT_KNOWLEDGE_SPECIALIST_ENABLED:true}
  cors:
    # Example: CORS_ALLOWED_ORIGINS=https://my-ui.example.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    # Example: CORS_ALLOWED_ORIGIN_PATTERNS=https://*.my-ui.example.com
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
    # Example: CORS_ALLOW_CREDENTIALS=true (only if you need cookies/session auth from the browser)
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}

loomai:
  deployment:
    manifest-url: ${LOOMAI_DEPLOYMENT_MANIFEST_URL:}
  smart-brain:
    enabled: ${LOOMAI_SMART_BRAIN_ENABLED:false}
    encryption-secret: ${LOOMAI_SMART_BRAIN_ENCRYPTION_SECRET:}
    fingerprint-secret: ${LOOMAI_SMART_BRAIN_FINGERPRINT_SECRET:}
    delivery-signing-secret: ${LOOMAI_SMART_BRAIN_DELIVERY_SIGNING_SECRET:}
    accepted-runtime-url: ${LOOMAI_RUNTIME_PUBLIC_BASE_URL:}
    operation-retention: ${LOOMAI_SMART_BRAIN_OPERATION_RETENTION:P30D}
    processing-delay-ms: ${LOOMAI_SMART_BRAIN_PROCESSING_DELAY_MS:2000}
    delivery-delay-ms: ${LOOMAI_SMART_BRAIN_DELIVERY_DELAY_MS:3000}
