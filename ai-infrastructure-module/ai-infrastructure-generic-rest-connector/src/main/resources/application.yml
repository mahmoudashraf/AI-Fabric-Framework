server:
  port: ${PORT:8082}

spring:
  autoconfigure:
    exclude:
      - ai.fabric.config.AIInfrastructureAutoConfiguration

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

rest-connector:
  # Platform-managed deployments override this with REST_CONNECTOR_ROUTING_CONFIG_LOCATION
  # pointing at a versioned platform artifact. The classpath default remains a neutral
  # safe-by-default fallback so packaging-only images still boot deterministically.
  routing-config-location: classpath:actions-routing.yml
  persistence:
    enabled: ${REST_CONNECTOR_PERSISTENCE_ENABLED:false}
    jdbc-url: ${REST_CONNECTOR_JDBC_URL:}
    username: ${REST_CONNECTOR_JDBC_USERNAME:}
    password: ${REST_CONNECTOR_JDBC_PASSWORD:}
    schema: ${REST_CONNECTOR_PERSISTENCE_SCHEMA:integration_connector}
    bootstrap-jdbc-url: ${REST_CONNECTOR_BOOTSTRAP_JDBC_URL:}
    bootstrap-username: ${REST_CONNECTOR_BOOTSTRAP_JDBC_USERNAME:}
    bootstrap-password: ${REST_CONNECTOR_BOOTSTRAP_JDBC_PASSWORD:}
    role-name: ${REST_CONNECTOR_DATABASE_ROLE:}
    maximum-pool-size: ${REST_CONNECTOR_DB_POOL_SIZE:4}
  conversation-channel:
    enabled: ${REST_CONNECTOR_CONVERSATION_CHANNEL_ENABLED:false}
    binding-id: ${REST_CONNECTOR_CONVERSATION_CHANNEL_BINDING_ID:}
    worker-id: ${REST_CONNECTOR_CONVERSATION_CHANNEL_WORKER_ID:conversation-channel-connector}
    runtime-base-url: ${REST_CONNECTOR_CONVERSATION_CHANNEL_RUNTIME_BASE_URL:}
    runtime-api-key-header: ${REST_CONNECTOR_CONVERSATION_CHANNEL_RUNTIME_API_KEY_HEADER:X-AIFABRIC-INTEGRATION-KEY}
    runtime-api-key: ${REST_CONNECTOR_CONVERSATION_CHANNEL_RUNTIME_API_KEY:}
    runtime-callback-signing-secret: ${REST_CONNECTOR_CONVERSATION_CHANNEL_RUNTIME_CALLBACK_SIGNING_SECRET:}
    provider-base-url: ${REST_CONNECTOR_CONVERSATION_CHANNEL_PROVIDER_BASE_URL:}
    provider-api-key-header: ${REST_CONNECTOR_CONVERSATION_CHANNEL_PROVIDER_API_KEY_HEADER:X-LoomAI-Inbox-Key}
    provider-api-key: ${REST_CONNECTOR_CONVERSATION_CHANNEL_PROVIDER_API_KEY:}
    provider-webhook-signing-secret: ${REST_CONNECTOR_CONVERSATION_CHANNEL_PROVIDER_WEBHOOK_SIGNING_SECRET:}
    lease-seconds: ${REST_CONNECTOR_CONVERSATION_CHANNEL_LEASE_SECONDS:30}
    request-timeout-seconds: ${REST_CONNECTOR_CONVERSATION_CHANNEL_REQUEST_TIMEOUT_SECONDS:10}
    callback-clock-skew-seconds: ${REST_CONNECTOR_CONVERSATION_CHANNEL_CALLBACK_CLOCK_SKEW_SECONDS:300}

app:
  cors:
    # Example: CORS_ALLOWED_ORIGINS=https://my-ui.example.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    # Example: CORS_ALLOWED_ORIGIN_PATTERNS=https://*.my-ui.example.com
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
    # Example: CORS_ALLOW_CREDENTIALS=true (only if you need cookies/session auth from the browser)
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
