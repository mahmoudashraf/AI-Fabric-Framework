connector:
  inbound-auth:
    allow-unauthenticated: false
    api-key:
      enabled: false
      header: X-AIFABRIC-API-KEY
      value: ""

  upstream:
    base-url: ""
    auth:
      type: none
      header: Authorization
      value: ""

  http:
    connect-timeout-ms: 2000
    timeout-ms: 8000
    retry:
      enabled: false
      max-attempts: 1
      backoff-ms: 200
      retry-on: [429, 502, 503, 504]

  idempotency:
    enabled: true
    ttl-seconds: 300
    in-progress-max-wait-ms: 2000

actions: {}

