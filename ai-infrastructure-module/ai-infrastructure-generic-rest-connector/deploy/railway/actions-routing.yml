# Railway deployment default routing config (template).
#
# This file is loaded by default in the Railway Dockerfile at:
#   /config/actions-routing.yml
#
# It is SAFE-BY-DEFAULT:
# - Requires inbound API key unless you explicitly allow unauthenticated access.
# - Contains no action routes by default (so /actions/execute will return ACTION_NOT_SUPPORTED).
#
# Add your routes under "actions:" and configure upstream base-url/auth.

connector:
  inbound-auth:
    allow-unauthenticated: ${CONNECTOR_ALLOW_UNAUTHENTICATED:false}
    api-key:
      enabled: ${CONNECTOR_API_KEY_ENABLED:true}
      header: ${CONNECTOR_API_KEY_HEADER:X-AIFABRIC-API-KEY}
      value: ${CONNECTOR_API_KEY:}

  upstream:
    # Required when using per-action "path" routes. If you use per-action absolute "url", you can leave this empty.
    base-url: ${UPSTREAM_BASE_URL:}
    auth:
      type: ${UPSTREAM_AUTH_TYPE:NONE} # NONE | API_KEY
      header: ${UPSTREAM_AUTH_HEADER:Authorization}
      value: ${UPSTREAM_AUTH_VALUE:}

  http:
    connect-timeout-ms: ${CONNECTOR_CONNECT_TIMEOUT_MS:2000}
    timeout-ms: ${CONNECTOR_TIMEOUT_MS:8000}
    retry:
      enabled: ${CONNECTOR_RETRY_ENABLED:false}
      max-attempts: ${CONNECTOR_RETRY_MAX_ATTEMPTS:2}
      backoff-ms: ${CONNECTOR_RETRY_BACKOFF_MS:200}
      retry-on: [429, 502, 503, 504]

  idempotency:
    enabled: ${CONNECTOR_IDEMPOTENCY_ENABLED:true}
    ttl-seconds: ${CONNECTOR_IDEMPOTENCY_TTL_SECONDS:300}
    in-progress-max-wait-ms: ${CONNECTOR_IDEMPOTENCY_IN_PROGRESS_MAX_WAIT_MS:2000}

actions:
  # Commerce demo routes (runtime actionIds -> connector-demo domain APIs).
  #
  # These assume your upstream is the connector demo service:
  #   UPSTREAM_BASE_URL=https://<connector-demo>.up.railway.app

  list_products:
    method: GET
    path: /api/products/search
    request:
      query:
        q: "{{params.query}}"
        limit: 10
        threshold: 0.3
    response:
      success-http-status: [200]
      message: "Products"

  search_products:
    method: GET
    path: /api/products/search
    request:
      query:
        q: "{{params.query}}"
        limit: 10
        threshold: 0.3
    response:
      success-http-status: [200]
      message: "Products"

  view_cart:
    method: GET
    path: /api/carts/active
    request:
      query:
        userId: "{{trace.userId}}"
    response:
      success-http-status: [200]
      message: "Cart"

  add_to_cart:
    method: POST
    path: /api/carts/active/items
    request:
      body:
        userId: "{{trace.userId}}"
        sku: "{{params.items[0].sku}}"
        quantity: "{{params.items[0].quantity|1}}"
    response:
      success-http-status: [200]
      message: "Added item to cart."

  remove_from_cart:
    method: DELETE
    path: /api/carts/active/items
    request:
      query:
        userId: "{{trace.userId}}"
        sku: "{{params.sku}}"
    response:
      success-http-status: [200]
      message: "Removed item from cart."

  apply_coupon_to_cart:
    method: POST
    path: /api/carts/active/coupon
    request:
      body:
        userId: "{{trace.userId}}"
        code: "{{params.code}}"
    response:
      success-http-status: [200]
      message: "Coupon applied."

  get_product_details:
    method: GET
    path: /api/products/by-sku
    request:
      query:
        sku: "{{params.sku}}"
    response:
      success-http-status: [200]
      message: "Product details"

  checkout_cart:
    method: POST
    path: /api/carts/active/checkout
    request:
      body:
        userId: "{{trace.userId}}"
        shippingAddress: "{{params.shippingAddress}}"
        email: "{{params.email}}"
        paymentMethod: "{{params.paymentMethod|CARD}}"
    response:
      success-http-status: [201]
      message: "Order created."

  create_purchase_order:
    method: POST
    path: /api/orders
    request:
      body:
        userId: "{{trace.userId}}"
        sku: "{{params.sku}}"
        quantity: "{{params.quantity|1}}"
        shippingAddress: "{{params.shippingAddress}}"
        email: "{{params.email}}"
    response:
      success-http-status: [201]
      message: "Purchase order created."

  cancel_purchase_order:
    method: POST
    path: /api/orders/cancel
    request:
      body:
        userId: "{{trace.userId}}"
        orderNumber: "{{params.orderNumber}}"
        orderId: "{{params.orderId}}"
    response:
      success-http-status: [200]
      message: "Order cancelled."

  list_orders:
    method: GET
    path: /api/orders
    request:
      query:
        userId: "{{trace.userId}}"
        limit: "{{params.limit|50}}"
    response:
      success-http-status: [200]
      message: "Orders"

  get_active_orders:
    method: GET
    path: /api/orders/active
    request:
      query:
        userId: "{{trace.userId}}"
        limit: "{{params.limit|25}}"
    response:
      success-http-status: [200]
      message: "Active orders"

  get_order_details:
    method: GET
    path: /api/orders/resolve
    request:
      query:
        userId: "{{trace.userId}}"
        orderNumberOrId: "{{params.orderNumberOrId}}"
    response:
      success-http-status: [200]
      message: "Order details"

  change_delivery_address:
    method: POST
    path: /api/orders/delivery-address
    request:
      body:
        userId: "{{trace.userId}}"
        shippingAddress: "{{params.shippingAddress}}"
        orderNumber: "{{params.orderNumber}}"
        orderId: "{{params.orderId}}"
    response:
      success-http-status: [200]
      message: "Delivery address updated."

  offer_order_discount:
    method: POST
    path: /api/orders/discount-offer
    request:
      body:
        userId: "{{trace.userId}}"
        orderNumber: "{{params.orderNumber}}"
        orderId: "{{params.orderId}}"
        discountPercent: "{{params.discountPercent|10}}"
    response:
      success-http-status: [200]
      message: "Discount offer applied."

  list_my_addresses:
    method: GET
    path: /api/addresses
    request:
      query:
        userId: "{{trace.userId}}"
        limit: "{{params.limit|50}}"
    response:
      success-http-status: [200]
      message: "Addresses"

  get_my_account:
    method: GET
    path: /api/accounts/by-user
    request:
      query:
        userId: "{{trace.userId}}"
    response:
      success-http-status: [200]
      message: "Account"

  create_support_ticket:
    method: POST
    path: /api/tickets
    request:
      body:
        userId: "{{trace.userId}}"
        issueType: "{{params.issueType}}"
        description: "{{params.description}}"
        orderNumber: "{{params.orderNumber}}"
    response:
      success-http-status: [201]
      message: "Support ticket created."

  add_review:
    method: POST
    path: /api/reviews
    request:
      body:
        userId: "{{trace.userId}}"
        productId: "{{params.productId}}"
        sku: "{{params.sku}}"
        rating: "{{params.rating}}"
        text: "{{params.text}}"
    response:
      success-http-status: [201]
      message: "Review submitted."

  track_shipment:
    method: GET
    path: /api/shipments/track
    request:
      query:
        userId: "{{trace.userId}}"
        orderNumber: "{{params.orderNumber}}"
    response:
      success-http-status: [200]
      message: "Shipment"

  create_return_request:
    method: POST
    path: /api/returns
    request:
      body:
        userId: "{{trace.userId}}"
        orderNumber: "{{params.orderNumber}}"
        reason: "{{params.reason}}"
    response:
      success-http-status: [201]
      message: "Return request created."
