ai:
  orchestration:
    profile: PRODUCTION_CHAT
    default-mode: navigator
    modes:
      navigator:
        information-mode: DETERMINISTIC_RAG_GENERATE
      navigator_deep:
        information-mode: DETERMINISTIC_RAG_GENERATE
        use-advanced-rag: true
        actions-enabled: false
        retrieval-enabled: true
        deep-retrieval-enabled: true
        # Deep mode should retrieve across spaces even when targets are pinned (reviews/policies).
        force-retrieval-when-targets-present: true
        force-retrieval-consider-stored-targets: true
        # Disable the deterministic "minimize RAG" skip heuristic in deep mode.
        minimize-rag-when-pinned-targets-cover-request: false
        # Enable bounded pinned-target evidence expansion for embedding queries in deep mode.
        # See: Final_Documentation/Development_Guides/RAG_EMBEDDING_QUERY_COMPOSITION_GUIDE.md
        rag-target-hint-enabled: true
        rag:
          fanout-enabled: true
          max-spaces: 6
          top-k-per-space: 8
          max-documents-returned-to-client: 30
          max-documents-used-for-context: 8
          max-context-chars: 6000
      executor:
        information-mode: LLM_DRIVEN
        actions-enabled: true
        retrieval-enabled: true
        deep-retrieval-enabled: false
        suggestions-enabled: false
        actions-preferred: true
        knowledge-base-overview-enabled: false
        retrieval-allowlist-required: true
        rag:
          max-documents-returned-to-client: 10
          max-documents-used-for-context: 5
          max-context-chars: 4000
          retrieval-vector-spaces-allowlist:
            - policy
      cart_assistant:
        information-mode: LLM_DRIVEN
    position-routing:
      landing: navigator
      catalog: navigator
      search: navigator
      cart: cart_assistant
