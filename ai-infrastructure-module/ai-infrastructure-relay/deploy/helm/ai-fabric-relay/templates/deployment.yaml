apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-fabric-relay.fullname" . }}
  labels:
    {{- include "ai-fabric-relay.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-fabric-relay.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-fabric-relay.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: relay
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: /config/
            - name: RELAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-fabric-relay.fullname" . }}-secrets
                  key: RELAY_API_KEY
          volumeMounts:
            - name: config
              mountPath: /config/application.yml
              subPath: application.yml
              readOnly: true
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "ai-fabric-relay.fullname" . }}-config
