apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-fabric-relay.fullname" . }}-config
  labels:
    {{- include "ai-fabric-relay.labels" . | nindent 4 }}
data:
  application.yml: |
    server:
      port: {{ .Values.service.port }}

    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus

    relay:
      auth:
        allowUnauthenticated: false
        apiKey:
          enabled: {{ .Values.relay.auth.apiKey.enabled }}
          header: {{ .Values.relay.auth.apiKey.header | quote }}
          value: ${RELAY_API_KEY}
      store:
        backend: {{ .Values.relay.store.backend | quote }}
        keyPrefix: aifabric:relay:
        redis:
          uri: {{ .Values.relay.store.redisUri | quote }}
      routing:
        mode: {{ .Values.relay.routing.mode | quote }}
        dispatcher:
          url: {{ .Values.relay.routing.dispatcherUrl | quote }}
        retrieval:
          url: {{ .Values.relay.routing.retrievalUrl | quote }}
