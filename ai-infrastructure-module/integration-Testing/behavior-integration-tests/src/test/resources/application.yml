spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:behavior_it;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

ai:
  behavior:
    enabled: true
    mode: FULL
  providers:
    enabled: true
    llm-provider: openai
    embedding-provider: onnx
    enable-fallback: false

    # Behavior integration tests do not require a live LLM provider.
    openai:
      enabled: false

    # Keep ONNX configured so embedding-provider=onnx is valid.
    onnx:
      enabled: true
      model-path: classpath:/models/embeddings/all-MiniLM-L6-v2.onnx
      tokenizer-path: classpath:/models/embeddings/tokenizer.json

# keep logging quiet in CI
logging:
  level:
    root: INFO
    org.springframework: INFO
    com.ai.infrastructure: INFO
