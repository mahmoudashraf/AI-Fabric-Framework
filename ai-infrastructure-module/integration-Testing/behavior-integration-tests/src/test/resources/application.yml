spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:behavior_it;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

ai:
  behavior:
    enabled: true
    mode: FULL
  providers:
    enabled: true
    # Support dynamic provider selection via system properties or environment variables
    # Priority: System property > Environment variable > Default (onnx)
    llm-provider: ${AI_INFRASTRUCTURE_LLM_PROVIDER:${LLM_PROVIDER:openai}}
    embedding-provider: ${AI_INFRASTRUCTURE_EMBEDDING_PROVIDER:${EMBEDDING_PROVIDER:onnx}}
    enable-fallback: false

    # OpenAI configuration - enable when selected as provider
    # Default to false to avoid initialization errors when API key is not set
    openai:
      enabled: ${AI_INFRASTRUCTURE_OPENAI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      max-tokens: 2000
      temperature: 0.0
      timeout: 30
      priority: 100

    # Keep ONNX configured so embedding-provider=onnx is valid.
    onnx:
      enabled: true
      model-path: classpath:/models/embeddings/all-MiniLM-L6-v2.onnx
      tokenizer-path: classpath:/models/embeddings/tokenizer.json

# keep logging quiet in CI
logging:
  level:
    root: INFO
    org.springframework: INFO
    com.ai.infrastructure: INFO
