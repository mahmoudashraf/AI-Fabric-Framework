<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Private Portfolio | LoomAI</title>
  <link rel="stylesheet" href="/proposals/assets/profile-access.css">
  <script src="/proposals/assets/profile-access.js" defer></script>
</head>
<body>
  <main class="access-panel">
    <a class="wordmark" href="https://loomai.pro/" aria-label="LoomAI home">LoomAI</a>
    <svg class="lock-mark" width="32" height="32" aria-hidden="true"><use href="/assets/proposals/icons-v2.svg#lock"></use></svg>
    <p class="eyebrow">Invitation only</p>
    <h1>A closer look at the work.</h1>
    <p class="intro">Enter your access code to view this AI Product Engineer portfolio.</p>
    <form data-profile-access>
      <label for="access-code">Access code</label>
      <input id="access-code" name="code" type="password" autocomplete="off" required maxlength="128" spellcheck="false">
      <p role="status" aria-live="polite" data-access-feedback></p>
      <button type="submit">View portfolio <span aria-hidden="true">&#8594;</span></button>
    </form>
    <a class="back-link" href="https://developer.loomai.pro/">Explore LoomAI for developers</a>
  </main>
</body>
</html>
