ai-config:
  vector-dimensions: 512

ai-entities:
  product:
    indexing:
      enabled: true
      max-characters: 8000
    analysis:
      enabled: false
      after: []
    searchable-fields:
      - name: name
        destinations: [SEMANTIC_SEARCH, RAG_CONTEXT]
        preprocessing: NORMALIZE
        priority: 100
        required: true
      - name: description
        destinations: [SEMANTIC_SEARCH, RAG_CONTEXT]
        preprocessing: CLEAN
        priority: 90
      - name: category
        destinations: [SEMANTIC_SEARCH, RAG_CONTEXT]
        preprocessing: NORMALIZE
        priority: 80
      - name: tags
        destinations: [SEMANTIC_SEARCH, RAG_CONTEXT]
        preprocessing: NORMALIZE
        priority: 70
      - name: sku
        destinations: [SEMANTIC_SEARCH, RAG_CONTEXT]
        preprocessing: NORMALIZE
        priority: 60
        required: true
    metadata-fields:
      - name: tenantId
        data-type: ID
        destinations: [VECTOR_METADATA]
        priority: 100
        required: true
      - name: sku
        data-type: ID
        destinations: [VECTOR_METADATA, API_RESPONSE]
        priority: 100
        required: true
      - name: category
        data-type: STRING
        destinations: [VECTOR_METADATA]
        priority: 80
      - name: price
        data-type: NUMBER
        destinations: [VECTOR_METADATA, API_RESPONSE]
        priority: 80
      - name: currency
        data-type: STRING
        destinations: [VECTOR_METADATA, API_RESPONSE]
        priority: 80
      - name: inStockQty
        data-type: NUMBER
        destinations: [VECTOR_METADATA]
        priority: 70

  policy:
    indexing:
      enabled: true
      max-characters: 8000
    analysis:
      enabled: false
      after: []
    searchable-fields:
      - name: title
        destinations: [SEMANTIC_SEARCH, RAG_CONTEXT]
        preprocessing: NORMALIZE
        priority: 100
        required: true
      - name: text
        destinations: [SEMANTIC_SEARCH, RAG_CONTEXT]
        preprocessing: CLEAN
        priority: 90
        required: true
      - name: classification
        destinations: [SEMANTIC_SEARCH, RAG_CONTEXT]
        preprocessing: NORMALIZE
        priority: 70
    metadata-fields:
      - name: tenantId
        data-type: ID
        destinations: [VECTOR_METADATA]
        priority: 100
        required: true
      - name: classification
        data-type: STRING
        destinations: [VECTOR_METADATA]
        priority: 80
      - name: title
        data-type: STRING
        destinations: [API_RESPONSE]
        priority: 70

  review:
    indexing:
      enabled: true
      max-characters: 8000
    analysis:
      enabled: false
      after: []
    searchable-fields:
      - name: text
        destinations: [SEMANTIC_SEARCH, RAG_CONTEXT]
        preprocessing: CLEAN
        priority: 100
        required: true
      - name: sku
        destinations: [SEMANTIC_SEARCH, RAG_CONTEXT]
        preprocessing: NORMALIZE
        priority: 80
        required: true
      - name: rating
        destinations: [SEMANTIC_SEARCH, RAG_CONTEXT]
        preprocessing: NORMALIZE
        priority: 60
    metadata-fields:
      - name: tenantId
        data-type: ID
        destinations: [VECTOR_METADATA]
        priority: 100
        required: true
      - name: sku
        data-type: ID
        destinations: [VECTOR_METADATA]
        priority: 100
        required: true
      - name: rating
        data-type: NUMBER
        destinations: [VECTOR_METADATA, API_RESPONSE]
        priority: 80
