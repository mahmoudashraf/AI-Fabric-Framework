server:
  port: ${PORT:8088}
  error:
    include-message: always

spring:
  application:
    name: ai-enablement-platform-backend
  datasource:
    url: ${PLATFORM_DB_URL:jdbc:postgresql://${PLATFORM_DB_HOST:localhost}:${PLATFORM_DB_PORT:5432}/${PLATFORM_DB_NAME:ai_enablement_platform}}
    driver-class-name: org.postgresql.Driver
    username: ${PLATFORM_DB_USERNAME:platform}
    password: ${PLATFORM_DB_PASSWORD:platform}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

platform:
  name: AI Enablement Platform
  stage: bootstrap
  current-phase: phase-21-public-provisioning-api
  bootstrap:
    sample-enabled: ${PLATFORM_BOOTSTRAP_SAMPLE_ENABLED:false}
    ecommerce-demo:
      enabled: ${PLATFORM_BOOTSTRAP_ECOMMERCE_DEMO_ENABLED:false}
      auto-apply: ${PLATFORM_BOOTSTRAP_ECOMMERCE_DEMO_AUTO_APPLY:false}
  auth:
    enabled: ${PLATFORM_AUTH_ENABLED:true}
    header-name: ${PLATFORM_AUTH_HEADER:X-PLATFORM-API-KEY}
    api-key-enabled: ${PLATFORM_AUTH_API_KEY_ENABLED:true}
    session-enabled: ${PLATFORM_AUTH_SESSION_ENABLED:true}
    session-cookie-name: ${PLATFORM_AUTH_SESSION_COOKIE_NAME:platform_session}
    session-ttl: ${PLATFORM_AUTH_SESSION_TTL:12h}
    session-cookie-secure: ${PLATFORM_AUTH_SESSION_COOKIE_SECURE:true}
    session-cookie-same-site: ${PLATFORM_AUTH_SESSION_COOKIE_SAME_SITE:Strict}
    operator-api-key: ${PLATFORM_OPERATOR_API_KEY:}
    admin-api-key: ${PLATFORM_ADMIN_API_KEY:}
    bootstrap-admin-enabled: ${PLATFORM_BOOTSTRAP_ADMIN_ENABLED:false}
    bootstrap-admin-email: ${PLATFORM_BOOTSTRAP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${PLATFORM_BOOTSTRAP_ADMIN_PASSWORD:}
    bootstrap-admin-display-name: ${PLATFORM_BOOTSTRAP_ADMIN_DISPLAY_NAME:Platform Admin}
  public-api:
    enabled: ${PLATFORM_PUBLIC_API_ENABLED:false}
    client-id-header-name: ${PLATFORM_PUBLIC_API_CLIENT_ID_HEADER:X-PLATFORM-CLIENT-ID}
    api-key-header-name: ${PLATFORM_PUBLIC_API_KEY_HEADER:X-PLATFORM-PUBLIC-API-KEY}
    clients: {}
  delivery:
    public-base-url: ${PLATFORM_PUBLIC_BASE_URL:http://localhost:${server.port}}
    signed-artifacts-enabled: ${PLATFORM_SIGNED_ARTIFACTS_ENABLED:true}
    artifact-url-ttl: ${PLATFORM_ARTIFACT_URL_TTL:3650d}
  provisioning:
    mode: ${PLATFORM_PROVISIONING_MODE:RAILWAY_STUB}
    railway-api-endpoint: ${RAILWAY_API_ENDPOINT:https://backboard.railway.com/graphql/v2}
    railway-api-token: ${RAILWAY_API_TOKEN:}
    repository: ${PLATFORM_DEPLOY_REPOSITORY:TheBaseRepo}
    branch: ${PLATFORM_DEPLOY_BRANCH:main}
    environment-name: ${PLATFORM_PROVISIONING_ENVIRONMENT:dev}
    workspace-id: ${RAILWAY_WORKSPACE_ID:}
    runtime-service-root: ${PLATFORM_RUNTIME_SERVICE_ROOT:ai-infrastructure-module/ai-fabric-runtime}
    runtime-dockerfile-path: ${PLATFORM_RUNTIME_DOCKERFILE_PATH:ai-infrastructure-module/ai-fabric-runtime/deploy/railway/Dockerfile}
    connector-service-root: ${PLATFORM_CONNECTOR_SERVICE_ROOT:ai-infrastructure-module/ai-infrastructure-generic-rest-connector}
    connector-dockerfile-path: ${PLATFORM_CONNECTOR_DOCKERFILE_PATH:ai-infrastructure-module/ai-infrastructure-generic-rest-connector/deploy/railway/Dockerfile}
    runtime-service-name-prefix: ${PLATFORM_RUNTIME_SERVICE_NAME_PREFIX:runtime}
    connector-service-name-prefix: ${PLATFORM_CONNECTOR_SERVICE_NAME_PREFIX:rest-connector}
    project-name-max-length: ${PLATFORM_PROJECT_NAME_MAX_LENGTH:32}
    cors-allowed-origins: ${PLATFORM_CORS_ALLOWED_ORIGINS:}
    cors-allowed-origin-patterns: ${PLATFORM_CORS_ALLOWED_ORIGIN_PATTERNS:}
    cors-allow-credentials: ${PLATFORM_CORS_ALLOW_CREDENTIALS:false}
    runtime-dev-defaults-enabled: ${PLATFORM_RUNTIME_DEV_DEFAULTS_ENABLED:false}
    runtime-proxy-timeout-ms: ${PLATFORM_RUNTIME_PROXY_TIMEOUT_MS:60000}
    deployment-poll-interval: ${PLATFORM_DEPLOYMENT_POLL_INTERVAL:5s}
    deployment-timeout: ${PLATFORM_DEPLOYMENT_TIMEOUT:10m}
  cors:
    allowed-origins: ${PLATFORM_CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allow-credentials: ${PLATFORM_CORS_ALLOW_CREDENTIALS:true}
  poc:
    runtime-timeout: ${PLATFORM_POC_RUNTIME_TIMEOUT:60s}
  verification:
    timeout: 3s
    runtime-indexing-overview-timeout: 10s
    post-apply-consistency-timeout: 10s
    post-apply-consistency-poll-interval: 500ms
    runtime-health-path: /actuator/health
    connector-health-path: /actuator/health
    runtime-connector-health-path: /api/admin/connector/health
    runtime-admin-overview-path: /api/admin/overview
    runtime-auth-overview-path: /api/admin/auth/overview
    runtime-actions-overview-path: /api/admin/actions/overview
    runtime-indexing-overview-path: /api/admin/indexing/overview
    connector-admin-overview-path: /api/admin/connector/overview
    connector-actions-overview-path: /api/admin/connector/actions/overview
    runner:
      script-root: ${PLATFORM_HOSTED_VERIFICATION_SCRIPT_ROOT:scripts}
      timeout: ${PLATFORM_HOSTED_VERIFICATION_TIMEOUT:10m}
      max-output-characters: ${PLATFORM_HOSTED_VERIFICATION_MAX_OUTPUT_CHARACTERS:200000}
  vectorization:
    registration-token-ttl: ${PLATFORM_VECTORIZATION_REGISTRATION_TOKEN_TTL:7d}
    runner-session-ttl: ${PLATFORM_VECTORIZATION_RUNNER_SESSION_TTL:6h}
    run-lease-ttl: ${PLATFORM_VECTORIZATION_RUN_LEASE_TTL:15m}
    max-recent-runs: ${PLATFORM_VECTORIZATION_MAX_RECENT_RUNS:20}
    required-product-version: ${PLATFORM_VECTORIZATION_REQUIRED_PRODUCT_VERSION:2026.04.track-b}
    required-compatibility-version: ${PLATFORM_VECTORIZATION_REQUIRED_COMPATIBILITY_VERSION:1}
    runner-provisioning:
      service-root: ${PLATFORM_VECTORIZATION_RUNNER_SERVICE_ROOT:ai-fabric-product/ai-fabric-vectorization-runner}
      dockerfile-path: ${PLATFORM_VECTORIZATION_RUNNER_DOCKERFILE_PATH:ai-fabric-product/ai-fabric-vectorization-runner/deploy/railway/Dockerfile}
      service-name-prefix: ${PLATFORM_VECTORIZATION_RUNNER_SERVICE_NAME_PREFIX:vectorization-runner}
      poll-interval: ${PLATFORM_VECTORIZATION_RUNNER_POLL_INTERVAL:15s}
  inference:
    provisioning:
      shared-project-name-prefix: ${PLATFORM_INFERENCE_SHARED_PROJECT_NAME_PREFIX:loom-inference}
      shared-embedding-service-root: ${PLATFORM_SHARED_EMBEDDING_SERVICE_ROOT:.}
      shared-embedding-dockerfile-path: ${PLATFORM_SHARED_EMBEDDING_DOCKERFILE_PATH:ai-fabric-product/ai-fabric-embedding-worker/deploy/railway/Dockerfile}
      shared-embedding-service-name-prefix: ${PLATFORM_SHARED_EMBEDDING_SERVICE_NAME_PREFIX:shared-embeddings}
      shared-embedding-health-path: ${PLATFORM_SHARED_EMBEDDING_HEALTH_PATH:/actuator/health}
      shared-ollama-service-root: ${PLATFORM_SHARED_OLLAMA_SERVICE_ROOT:ai-fabric-product/ai-fabric-shared-ollama-service}
      shared-ollama-dockerfile-path: ${PLATFORM_SHARED_OLLAMA_DOCKERFILE_PATH:ai-fabric-product/ai-fabric-shared-ollama-service/deploy/railway/Dockerfile}
      shared-ollama-service-name-prefix: ${PLATFORM_SHARED_OLLAMA_SERVICE_NAME_PREFIX:shared-ollama}
      shared-ollama-health-path: ${PLATFORM_SHARED_OLLAMA_HEALTH_PATH:/api/tags}
      dedicated-embedding-service-root: ${PLATFORM_DEDICATED_EMBEDDING_SERVICE_ROOT:.}
      dedicated-embedding-dockerfile-path: ${PLATFORM_DEDICATED_EMBEDDING_DOCKERFILE_PATH:ai-fabric-product/ai-fabric-embedding-worker/deploy/railway/Dockerfile}
      dedicated-embedding-service-name-prefix: ${PLATFORM_DEDICATED_EMBEDDING_SERVICE_NAME_PREFIX:embedding-worker}
      dedicated-embedding-health-path: ${PLATFORM_DEDICATED_EMBEDDING_HEALTH_PATH:/actuator/health}
      poll-interval: ${PLATFORM_INFERENCE_PROVISIONING_POLL_INTERVAL:15s}
      request-timeout: ${PLATFORM_INFERENCE_PROVISIONING_REQUEST_TIMEOUT:5m}
  product-service:
    provisioning:
      shared-project-name-prefix: ${PLATFORM_PRODUCT_SHARED_PROJECT_NAME_PREFIX:loom-product}
      shopify-bridge-service-root: ${PLATFORM_SHOPIFY_BRIDGE_SERVICE_ROOT:product-services/shopify-bridge-service}
      shopify-bridge-dockerfile-path: ${PLATFORM_SHOPIFY_BRIDGE_DOCKERFILE_PATH:product-services/shopify-bridge-service/deploy/railway/Dockerfile}
      shopify-bridge-service-name-prefix: ${PLATFORM_SHOPIFY_BRIDGE_SERVICE_NAME_PREFIX:shopify-bridge}
      shopify-bridge-health-path: ${PLATFORM_SHOPIFY_BRIDGE_HEALTH_PATH:/actuator/health}
      poll-interval: ${PLATFORM_PRODUCT_PROVISIONING_POLL_INTERVAL:15s}
      request-timeout: ${PLATFORM_PRODUCT_PROVISIONING_REQUEST_TIMEOUT:5m}

shopify:
  companion:
    bootstrap:
      default-environment: ${SHOPIFY_COMPANION_DEFAULT_ENVIRONMENT:dev}
      default-template-id: ${SHOPIFY_COMPANION_DEFAULT_TEMPLATE_ID:dev-openai-qdrant}
      default-vector-provisioning-mode: ${SHOPIFY_COMPANION_DEFAULT_VECTOR_PROVISIONING_MODE:}
      default-qdrant-host: ${SHOPIFY_COMPANION_DEFAULT_QDRANT_HOST:}
      default-qdrant-source-deployment-id: ${SHOPIFY_COMPANION_DEFAULT_QDRANT_SOURCE_DEPLOYMENT_ID:}
      default-qdrant-runtime-api-key-secret-name: ${SHOPIFY_COMPANION_DEFAULT_QDRANT_RUNTIME_API_KEY_SECRET_NAME:}
      template-plugin-id: ${SHOPIFY_COMPANION_TEMPLATE_PLUGIN_ID:mkp-template-shopify-companion}
      template-plugin-version: ${SHOPIFY_COMPANION_TEMPLATE_PLUGIN_VERSION:}
      default-plugin-ids:
        - ${SHOPIFY_COMPANION_PLUGIN_ID_1:mkp-action-shopify-companion-read}
        - ${SHOPIFY_COMPANION_PLUGIN_ID_2:mkp-data-shopify-catalog}
        - ${SHOPIFY_COMPANION_PLUGIN_ID_3:mkp-data-shopify-policies}
        - ${SHOPIFY_COMPANION_PLUGIN_ID_4:mkp-inference-shared-embeddings}

logging:
  level:
    com.ai.fabric.platform: INFO
