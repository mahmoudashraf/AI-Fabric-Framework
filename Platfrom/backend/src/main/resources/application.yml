server:
  port: ${PORT:8088}
  error:
    include-message: always

spring:
  application:
    name: ai-enablement-platform-backend
  datasource:
    url: jdbc:h2:file:./data/ai-enablement-platform;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

platform:
  name: AI Enablement Platform
  stage: bootstrap
  current-phase: phase-10-railway-preflight
  delivery:
    public-base-url: ${PLATFORM_PUBLIC_BASE_URL:http://localhost:${server.port}}
  provisioning:
    mode: ${PLATFORM_PROVISIONING_MODE:RAILWAY_STUB}
    railway-api-endpoint: ${RAILWAY_API_ENDPOINT:https://backboard.railway.com/graphql/v2}
    railway-api-token: ${RAILWAY_API_TOKEN:}
    repository: ${PLATFORM_DEPLOY_REPOSITORY:TheBaseRepo}
    branch: ${PLATFORM_DEPLOY_BRANCH:main}
    environment-name: ${PLATFORM_PROVISIONING_ENVIRONMENT:dev}
    workspace-id: ${RAILWAY_WORKSPACE_ID:}
    runtime-service-root: ${PLATFORM_RUNTIME_SERVICE_ROOT:ai-infrastructure-module/ai-fabric-runtime}
    connector-service-root: ${PLATFORM_CONNECTOR_SERVICE_ROOT:ai-infrastructure-module/ai-infrastructure-generic-rest-connector}
    runtime-service-name-prefix: ${PLATFORM_RUNTIME_SERVICE_NAME_PREFIX:runtime}
    connector-service-name-prefix: ${PLATFORM_CONNECTOR_SERVICE_NAME_PREFIX:rest-connector}
    cors-allowed-origins: ${PLATFORM_CORS_ALLOWED_ORIGINS:}
    cors-allowed-origin-patterns: ${PLATFORM_CORS_ALLOWED_ORIGIN_PATTERNS:}
    cors-allow-credentials: ${PLATFORM_CORS_ALLOW_CREDENTIALS:false}
    runtime-dev-defaults-enabled: ${PLATFORM_RUNTIME_DEV_DEFAULTS_ENABLED:false}
    runtime-proxy-timeout-ms: ${PLATFORM_RUNTIME_PROXY_TIMEOUT_MS:60000}
    deployment-poll-interval: ${PLATFORM_DEPLOYMENT_POLL_INTERVAL:5s}
    deployment-timeout: ${PLATFORM_DEPLOYMENT_TIMEOUT:10m}
  cors:
    allowed-origins:
      - http://localhost:5173
  verification:
    timeout: 3s
    runtime-health-path: /actuator/health
    connector-health-path: /actuator/health

logging:
  level:
    com.ai.fabric.platform: INFO
