spring:
  datasource:
    url: jdbc:h2:mem:ai-enablement-platform-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    # V121-V124 are production Coolify target-profile tuning migrations that
    # rely on PostgreSQL JSONB operators. The test-only V120.1 migration mirrors
    # the later application schema additions without executing those
    # production-only data updates against H2.
    locations: classpath:db/migration,classpath:db/test-migration
    target: "120.1"

platform:
  bootstrap:
    sample-enabled: false
  marketplace:
    dataset-sync:
      enabled: false
  shopify:
    provisioning:
      enabled: false
    vectorization:
      enabled: false
  auth:
    enabled: false
    bootstrap-admin-enabled: true
    bootstrap-admin-email: admin@test.platform
    bootstrap-admin-password: TestAdminPass123!
    bootstrap-admin-display-name: Test Platform Admin
    session-cookie-secure: false
    session-cookie-same-site: Lax

PLATFORM_ARTIFACT_SIGNING_KEY: test-platform-artifact-signing-key
