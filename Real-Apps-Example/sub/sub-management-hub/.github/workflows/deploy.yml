name: Deploy Subscription Management Hub

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Build AI Infrastructure Module
        run: |
          cd ../../ai-infrastructure-module
          mvn clean install -DskipTests -pl ai-infrastructure-core,ai-infrastructure-behavior,victor-databases/ai-infrastructure-vector-lucene,providers/ai-infrastructure-onnx-starter,providers/ai-infrastructure-provider-cohere -am
      
      - name: Build Application
        run: |
          cd Real-Apps-Example/subscription-management-hub
          mvn clean package -DskipTests
      
      - name: Build Docker image
        run: |
          cd Real-Apps-Example/subscription-management-hub
          docker build -t subscription-hub:latest .
      
      - name: Run tests (optional)
        run: |
          cd Real-Apps-Example/subscription-management-hub
          mvn test || true
      
