spring:
  application:
    name: subscription-management-hub
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/subscriptiondb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

ai:
  config:
    default-file: ai-entity-config.yml
  
  providers:
    embedding:
      provider: onnx
    generation:
      provider: cohere
      model: command-r-plus
      max-tokens: 1000
      temperature: 0.7
  
  vector:
    database: lucene
    storage-path: ${VECTOR_STORAGE_PATH:./data/vectors}
  
  cohere:
    api-key: ${COHERE_API_KEY:}
    base-url: https://api.cohere.ai/v1
  
  behavior:
    enabled: true
    mode: LIGHT
  
  pii-detection:
    enabled: true
    mode: DETECT_ONLY

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.subscription.hub: INFO
    com.ai.infrastructure: WARN
    org.springframework: WARN
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
