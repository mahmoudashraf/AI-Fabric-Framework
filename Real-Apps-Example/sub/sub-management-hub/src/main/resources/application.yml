spring:
  application:
    name: subscription-management-hub
  
  datasource:
    url: jdbc:h2:file:./data/subscriptiondb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

ai:
  config:
    default-file: ai-entity-config.yml
  
  providers:
    llm-provider: cohere
    embedding-provider: onnx
    generation:
      provider: cohere
      model: command-r-plus
      max-tokens: 1000
      temperature: 0.7
  
  vector:
    database: lucene
  
  onnx:
    enabled: true
    model-path: classpath:/models/embeddings/all-MiniLM-L6-v2.onnx
    tokenizer-path: classpath:/models/embeddings/tokenizer.json
    max-sequence-length: 512
    use-gpu: false
  
  cohere:
    enabled: true
    api-key: ${COHERE_API_KEY:}
    base-url: https://api.cohere.ai/v1
    model: command-r-plus
  
  behavior:
    enabled: false
    mode: LIGHT
  
  pii-detection:
    enabled: false
    mode: DETECT_ONLY

logging:
  level:
    com.subscription.hub: DEBUG
    com.ai.infrastructure: INFO
