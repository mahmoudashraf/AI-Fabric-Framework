spring:
  application:
    name: subscription-management-hub
  
  datasource:
    url: jdbc:h2:file:./data/subscriptiondb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

ai:
  enabled: true
  providers:
    generation:
      provider: cohere
      model: command-r-plus
      max-tokens: 1000
      temperature: 0.7
  
  cohere:
    api-key: ${COHERE_API_KEY:7GC502ZDSVS6pbahBGorqEiV2z6mFp5srMn9s4L2}
    base-url: https://api.cohere.ai/v1
  
  pii-detection:
    enabled: false
    mode: DETECT_ONLY

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    com.subscription.hub: DEBUG
    com.ai.infrastructure: INFO
