spring:
  application:
    name: subscription-management-hub

server:
  port: 8081
  
  datasource:
    url: jdbc:h2:mem:subscriptiondb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
        # Fix JSONB for H2 - use TEXT instead
        globally_quoted_identifiers: true

ai:
  enabled: true
  config:
    default-file: ai-entity-config.yml
  
  providers:
    embedding:
      provider: rest
    generation:
      provider: rest
      model: gpt-4
      max-tokens: 1000
      temperature: 0.7
    openai:
      enabled: false
    rest:
      enabled: true
      base-url: http://localhost:8080
      endpoint: /api/embeddings
  
  behavior:
    enabled: true
    mode: LIGHT
  
  pii-detection:
    enabled: true
    mode: DETECT_ONLY
  
  vector-db:
    provider: lucene

logging:
  level:
    com.subscription.hub: DEBUG
    com.ai.infrastructure: INFO
