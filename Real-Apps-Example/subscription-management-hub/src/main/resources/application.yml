spring:
  application:
    name: subscription-management-hub
  
  datasource:
    url: jdbc:h2:mem:subscriptiondb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

ai:
  config:
    default-file: ai-entity-config.yml
  
  providers:
    embedding:
      provider: onnx
    generation:
      provider: openai
      model: gpt-4
      max-tokens: 1000
      temperature: 0.7
  
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com/v1
  
  behavior:
    enabled: true
    mode: LIGHT
  
  pii-detection:
    enabled: true
    mode: DETECT_ONLY

logging:
  level:
    com.subscription.hub: DEBUG
    com.ai.infrastructure: INFO
