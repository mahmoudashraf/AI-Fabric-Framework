services:
  postgres:
    image: postgres:16
    container_name: ai-fabric-cloud-vector-postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: cloud_vector_search
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    # Keep Qdrant server version aligned with the Java client used by ai-infrastructure-vector-qdrant (io.qdrant:client:1.16.1)
    image: qdrant/qdrant:v1.16.1
    container_name: ai-fabric-cloud-vector-qdrant
    ports:
      - "6333:6333"   # HTTP
      - "6334:6334"   # gRPC (used by AI Fabric Qdrant client)
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  postgres_data:
  qdrant_storage:
