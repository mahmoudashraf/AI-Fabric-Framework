services:
  ecommerce-store:
    build:
      context: ../../../..
      dockerfile: Real_Apps/ecommerce-store/Dockerfile
    image: ecommerce-store:local
    container_name: ecommerce-store
    restart: unless-stopped
    ports:
      - "8096:8096"
    environment:
      PORT: 8096

      # Optional: event-based indexing (Domain API -> Runtime Data Sync, via REST connector)
      CONNECTOR_INDEXING_ENABLED: ${CONNECTOR_INDEXING_ENABLED:-true}
      CONNECTOR_INDEXING_RUNTIME_BASE_URL: ${CONNECTOR_INDEXING_RUNTIME_BASE_URL:-http://rest-connector:8082}
      CONNECTOR_INDEXING_API_KEY: ${CONNECTOR_INDEXING_API_KEY:-}
      CONNECTOR_INDEXING_API_KEY_HEADER: ${CONNECTOR_INDEXING_API_KEY_HEADER:-X-AIFABRIC-API-KEY}
    volumes:
      - connector_data:/app/data

  rest-connector:
    build:
      context: ../../../..
      dockerfile: ai-infrastructure-module/ai-infrastructure-generic-rest-connector/Dockerfile
    image: ai-infrastructure-generic-rest-connector:local
    container_name: ai-infrastructure-generic-rest-connector
    restart: unless-stopped
    depends_on:
      - ecommerce-store
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      REST_CONNECTOR_ROUTING_CONFIG_LOCATION: file:/config/actions-routing.yml

      # Optional: expose /api/ai/data-sync/* on the rest connector and proxy to the runtime.
      # This is useful if you want "connector = single base URL" for actions + indexing.
      REST_CONNECTOR_RUNTIME_PROXY_ENABLED: ${REST_CONNECTOR_RUNTIME_PROXY_ENABLED:-true}
      REST_CONNECTOR_RUNTIME_PROXY_BASE_URL: ${REST_CONNECTOR_RUNTIME_PROXY_BASE_URL:-http://ai-fabric-runtime:8097}
      REST_CONNECTOR_RUNTIME_PROXY_API_KEY: ${REST_CONNECTOR_RUNTIME_PROXY_API_KEY:-}
      REST_CONNECTOR_RUNTIME_PROXY_API_KEY_HEADER: ${REST_CONNECTOR_RUNTIME_PROXY_API_KEY_HEADER:-X-ADMIN-API-KEY}

      # Local/dev defaults.
      CONNECTOR_ALLOW_UNAUTHENTICATED: true
      CONNECTOR_API_KEY_ENABLED: false

      # Point at the Ecommerce Store inside the Docker network.
      UPSTREAM_BASE_URL: http://ecommerce-store:8096

      # Enable runtime -> rest-connector -> ecommerce-store authz checks.
      AUTHZ_ENABLED: true
    volumes:
      - ../rest-connector/actions-routing.yml:/config/actions-routing.yml:ro

  ai-fabric-runtime:
    build:
      context: ../../../..
      dockerfile: ai-infrastructure-module/ai-fabric-runtime/Dockerfile
    image: ai-fabric-runtime:local
    container_name: ai-fabric-runtime
    restart: unless-stopped
    depends_on:
      - rest-connector
    ports:
      - "8097:8097"
    environment:
      PORT: 8097

      # LLM/embeddings provider (OpenAI is opt-in)
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-512}

      # CORS (for hosted UIs)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-}

      # Connector-backed actions (Runtime -> Generic REST Connector)
      ACTIONS_CONNECTOR_BASE_URL: ${ACTIONS_CONNECTOR_BASE_URL:-http://rest-connector:8082}
      ACTIONS_CONNECTOR_API_KEY: ${ACTIONS_CONNECTOR_API_KEY:-}

    volumes:
      - ../runtime/config:/config:ro
      - runtime_data:/data
    command:
      - "--spring.config.additional-location=file:/config/"

volumes:
  runtime_data:
  connector_data:
