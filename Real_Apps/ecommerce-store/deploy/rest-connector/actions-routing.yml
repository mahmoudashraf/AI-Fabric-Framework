#
# Generic REST Connector routing config for the Ecommerce Store demo.
#
# Topology:
#   AI Fabric Runtime -> Generic REST Connector (/actions/*) -> Ecommerce Store domain APIs (/api/*)
#
# This file is intended for:
# - local Docker Compose (default upstream points at the in-network "ecommerce-store" service)
# - Railway deployments (override UPSTREAM_BASE_URL to your ecommerce-store URL)
#

connector:
  inbound-auth:
    # Local/dev default. For Railway/prod: set to false and enable api-key.
    allow-unauthenticated: ${CONNECTOR_ALLOW_UNAUTHENTICATED:true}
    api-key:
      enabled: ${CONNECTOR_API_KEY_ENABLED:false}
      header: ${CONNECTOR_API_KEY_HEADER:X-AIFABRIC-API-KEY}
      value: ${CONNECTOR_API_KEY:}

  upstream:
    # In Docker Compose, the ecommerce store service hostname is "ecommerce-store".
    # For Railway, set: UPSTREAM_BASE_URL=https://<your-ecommerce-store>.up.railway.app
    base-url: ${UPSTREAM_BASE_URL:http://ecommerce-store:8096}
    auth:
      type: ${UPSTREAM_AUTH_TYPE:NONE} # NONE | API_KEY
      header: ${UPSTREAM_AUTH_HEADER:Authorization}
      value: ${UPSTREAM_AUTH_VALUE:}

  http:
    connect-timeout-ms: ${CONNECTOR_CONNECT_TIMEOUT_MS:2000}
    timeout-ms: ${CONNECTOR_TIMEOUT_MS:8000}
    retry:
      enabled: ${CONNECTOR_RETRY_ENABLED:false}
      max-attempts: ${CONNECTOR_RETRY_MAX_ATTEMPTS:2}
      backoff-ms: ${CONNECTOR_RETRY_BACKOFF_MS:200}
      retry-on: [429, 502, 503, 504]

  idempotency:
    enabled: ${CONNECTOR_IDEMPOTENCY_ENABLED:true}
    ttl-seconds: ${CONNECTOR_IDEMPOTENCY_TTL_SECONDS:300}
    in-progress-max-wait-ms: ${CONNECTOR_IDEMPOTENCY_IN_PROGRESS_MAX_WAIT_MS:2000}

authz:
  # When enabled, exposes POST /api/authz/check and forwards to the configured upstream.
  # Typical topology: runtime -> rest-connector -> customer authz service.
  enabled: ${AUTHZ_ENABLED:false}
  path: ${AUTHZ_PATH:/api/authz/check}
  upstream:
    # If blank, the connector will fall back to connector.upstream.base-url (so ecommerce-store can serve both actions + authz).
    base-url: ${AUTHZ_UPSTREAM_BASE_URL:}
    auth:
      type: ${AUTHZ_UPSTREAM_AUTH_TYPE:NONE} # NONE | API_KEY
      header: ${AUTHZ_UPSTREAM_AUTH_HEADER:Authorization}
      value: ${AUTHZ_UPSTREAM_AUTH_VALUE:}
  http:
    connect-timeout-ms: ${AUTHZ_CONNECT_TIMEOUT_MS:500}
    timeout-ms: ${AUTHZ_TIMEOUT_MS:1500}

actions:
  # Commerce demo routes (runtime actionIds -> ecommerce-store domain APIs).

  list_products:
    method: GET
    path: /api/products/search
    request:
      query:
        q: "{{params.query}}"
        limit: 10
        threshold: 0.3
    response:
      success-http-status: [200]
      message: "Products"
    authz:
      enabled: true
      resourceId: action:list_products
      operationType: EXECUTE_ACTION

  search_products:
    method: GET
    path: /api/products/search
    request:
      query:
        q: "{{params.query}}"
        limit: 10
        threshold: 0.3
    response:
      success-http-status: [200]
      message: "Products"
    authz:
      enabled: true
      resourceId: action:search_products
      operationType: EXECUTE_ACTION

  view_cart:
    method: GET
    path: /api/carts/active
    request:
      query:
        userId: "{{trace.authContext.subjectId}}"
    response:
      success-http-status: [200]
      message: "Cart"
    authz:
      enabled: true
      resourceId: action:view_cart
      operationType: EXECUTE_ACTION

  add_to_cart:
    method: POST
    path: /api/carts/active/items
    request:
      body:
        userId: "{{trace.authContext.subjectId}}"
        sku: "{{params.sku}}"
        productId: "{{params.productId}}"
        quantity: "{{params.quantity|1}}"
    response:
      success-http-status: [200]
      message: "Added item to cart."
    authz:
      enabled: true
      resourceId: action:add_to_cart
      operationType: EXECUTE_ACTION

  remove_from_cart:
    method: DELETE
    path: /api/carts/active/items
    request:
      query:
        userId: "{{trace.authContext.subjectId}}"
        sku: "{{params.sku}}"
    response:
      success-http-status: [200]
      message: "Removed item from cart."
    authz:
      enabled: true
      resourceId: action:remove_from_cart
      operationType: EXECUTE_ACTION

  apply_coupon_to_cart:
    method: POST
    path: /api/carts/active/coupon
    request:
      body:
        userId: "{{trace.authContext.subjectId}}"
        code: "{{params.code}}"
    response:
      success-http-status: [200]
      message: "Coupon applied."
    authz:
      enabled: true
      resourceId: action:apply_coupon_to_cart
      operationType: EXECUTE_ACTION

  get_product_details:
    method: GET
    path: /api/products/by-sku
    request:
      query:
        sku: "{{params.sku}}"
    response:
      success-http-status: [200]
      message: "Product details"
    authz:
      enabled: true
      resourceId: action:get_product_details
      operationType: EXECUTE_ACTION

  find_similar_products:
    method: GET
    path: /api/products/similar
    request:
      query:
        sku: "{{params.sku}}"
        limit: "{{params.limit|5}}"
    response:
      success-http-status: [200]
      message: "Similar products"
    authz:
      enabled: true
      resourceId: action:find_similar_products
      operationType: EXECUTE_ACTION

  compare_products:
    method: GET
    path: /api/products/compare
    request:
      query:
        referenceSku: "{{params.referenceSku}}"
        comparisonSku: "{{params.comparisonSku}}"
    response:
      success-http-status: [200]
      message: "Product comparison"
    authz:
      enabled: true
      resourceId: action:compare_products
      operationType: EXECUTE_ACTION

  check_availability:
    method: GET
    path: /api/products/by-sku
    request:
      query:
        sku: "{{params.sku}}"
    response:
      success-http-status: [200]
      message: "Availability"
    authz:
      enabled: true
      resourceId: action:check_availability
      operationType: EXECUTE_ACTION

  get_policy:
    method: GET
    path: /api/policies/search
    request:
      query:
        q: "{{params.query}}"
        limit: 5
        threshold: 0.3
    response:
      success-http-status: [200]
      message: "Policies"
    authz:
      enabled: true
      resourceId: action:get_policy
      operationType: EXECUTE_ACTION

  checkout_cart:
    method: POST
    path: /api/carts/active/checkout
    request:
      body:
        userId: "{{trace.authContext.subjectId}}"
        shippingAddress: "{{params.shippingAddress}}"
        email: "{{params.email}}"
        paymentMethod: "{{params.paymentMethod|CARD}}"
    response:
      success-http-status: [201]
      message: "Order created."
    authz:
      enabled: true
      resourceId: action:checkout_cart
      operationType: EXECUTE_ACTION

  create_purchase_order:
    method: POST
    path: /api/orders
    request:
      body:
        userId: "{{trace.authContext.subjectId}}"
        sku: "{{params.sku}}"
        quantity: "{{params.quantity|1}}"
        shippingAddress: "{{params.shippingAddress}}"
        email: "{{params.email}}"
    response:
      success-http-status: [201]
      message: "Purchase order created."
    authz:
      enabled: true
      resourceId: action:create_purchase_order
      operationType: EXECUTE_ACTION

  cancel_purchase_order:
    method: POST
    path: /api/orders/cancel
    request:
      body:
        userId: "{{trace.authContext.subjectId}}"
        orderNumber: "{{params.orderNumber}}"
        orderId: "{{params.orderId}}"
    response:
      success-http-status: [200]
      message: "Order cancelled."
    authz:
      enabled: true
      resourceId: action:cancel_purchase_order
      operationType: EXECUTE_ACTION

  list_orders:
    method: GET
    path: /api/orders
    request:
      query:
        userId: "{{trace.authContext.subjectId}}"
        limit: "{{params.limit|50}}"
    response:
      success-http-status: [200]
      message: "Orders"
    authz:
      enabled: true
      resourceId: action:list_orders
      operationType: EXECUTE_ACTION

  get_active_orders:
    method: GET
    path: /api/orders/active
    request:
      query:
        userId: "{{trace.authContext.subjectId}}"
        limit: "{{params.limit|25}}"
    response:
      success-http-status: [200]
      message: "Active orders"
    authz:
      enabled: true
      resourceId: action:get_active_orders
      operationType: EXECUTE_ACTION

  get_order_details:
    method: GET
    path: /api/orders/resolve
    request:
      query:
        userId: "{{trace.authContext.subjectId}}"
        orderNumberOrId: "{{params.orderNumberOrId}}"
    response:
      success-http-status: [200]
      message: "Order details"
    authz:
      enabled: true
      resourceId: action:get_order_details
      operationType: EXECUTE_ACTION

  change_delivery_address:
    method: POST
    path: /api/orders/delivery-address
    request:
      body:
        userId: "{{trace.authContext.subjectId}}"
        orderNumber: "{{params.orderNumber}}"
        orderId: "{{params.orderId}}"
        shippingAddress: "{{params.shippingAddress}}"
    response:
      success-http-status: [200]
      message: "Delivery address updated."
    authz:
      enabled: true
      resourceId: action:change_delivery_address
      operationType: EXECUTE_ACTION

  offer_order_discount:
    method: POST
    path: /api/orders/discount
    request:
      body:
        userId: "{{trace.authContext.subjectId}}"
        orderNumber: "{{params.orderNumber}}"
        orderId: "{{params.orderId}}"
        discountPercent: "{{params.discountPercent|10}}"
    response:
      success-http-status: [200]
      message: "Discount applied."
    authz:
      enabled: true
      resourceId: action:offer_order_discount
      operationType: EXECUTE_ACTION

  list_my_addresses:
    method: GET
    path: /api/accounts/addresses
    request:
      query:
        userId: "{{trace.authContext.subjectId}}"
        limit: "{{params.limit|50}}"
    response:
      success-http-status: [200]
      message: "Addresses"
    authz:
      enabled: true
      resourceId: action:list_my_addresses
      operationType: EXECUTE_ACTION

  get_my_account:
    method: GET
    path: /api/accounts/me
    request:
      query:
        userId: "{{trace.authContext.subjectId}}"
    response:
      success-http-status: [200]
      message: "Account"
    authz:
      enabled: true
      resourceId: action:get_my_account
      operationType: EXECUTE_ACTION

  create_support_ticket:
    method: POST
    path: /api/support/tickets
    request:
      body:
        userId: "{{trace.authContext.subjectId}}"
        issueType: "{{params.issueType}}"
        description: "{{params.description}}"
        orderNumber: "{{params.orderNumber}}"
    response:
      success-http-status: [201]
      message: "Support ticket created."
    authz:
      enabled: true
      resourceId: action:create_support_ticket
      operationType: EXECUTE_ACTION

  add_review:
    method: POST
    path: /api/reviews
    request:
      body:
        userId: "{{trace.authContext.subjectId}}"
        productId: "{{params.productId}}"
        sku: "{{params.sku}}"
        rating: "{{params.rating|5}}"
        text: "{{params.text}}"
    response:
      success-http-status: [201]
      message: "Review added."
    authz:
      enabled: true
      resourceId: action:add_review
      operationType: EXECUTE_ACTION

  track_shipment:
    method: GET
    path: /api/shipping/track
    request:
      query:
        userId: "{{trace.authContext.subjectId}}"
        orderNumber: "{{params.orderNumber}}"
    response:
      success-http-status: [200]
      message: "Shipment"
    authz:
      enabled: true
      resourceId: action:track_shipment
      operationType: EXECUTE_ACTION

  create_return_request:
    method: POST
    path: /api/returns
    request:
      body:
        userId: "{{trace.authContext.subjectId}}"
        orderNumber: "{{params.orderNumber}}"
        reason: "{{params.reason}}"
    response:
      success-http-status: [201]
      message: "Return request created."
    authz:
      enabled: true
      resourceId: action:create_return_request
      operationType: EXECUTE_ACTION
