server:
  port: ${PORT:8096}
  forward-headers-strategy: framework

spring:
  application:
    name: chat-capabilities-demo
  datasource:
    url: jdbc:h2:file:./data/chat-capabilities.db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

ai:
  enabled: true
  config:
    default-file: ai-entity-config.yml

  chat:
    enabled: true
    window-size: 12
    max-context-chars: 8000
    auto-create-sessions: true

  providers:
    llm-provider: openai
    embedding-provider: openai
    openai:
      enabled: ${OPENAI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      timeout: 45

  vector-db:
    type: lucene
    lucene:
      index-path: ./data/lucene-vector-index

  indexing:
    enabled: true
    async-worker:
      enabled: true
      fixed-delay: PT0.5S
      batch-size: 25

  service:
    features:
      enable-generation: ${OPENAI_ENABLED:false}
      enable-embeddings: ${OPENAI_ENABLED:false}
      enable-search: true
      enable-rag: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.ai.fabric.realapps.chat: INFO
    com.ai.infrastructure: INFO
