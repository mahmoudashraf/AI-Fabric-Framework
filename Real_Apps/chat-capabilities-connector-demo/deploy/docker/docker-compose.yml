services:
  connector:
    build:
      context: ../../../..
      dockerfile: Real_Apps/chat-capabilities-connector-demo/Dockerfile
    image: chat-capabilities-connector-demo:local
    container_name: chat-capabilities-connector-demo
    restart: unless-stopped
    ports:
      - "8096:8096"
    environment:
      PORT: 8096

      # Optional: API key auth for /actions/execute
      CONNECTOR_AUTH_API_KEY: ${CONNECTOR_AUTH_API_KEY:-}
      CONNECTOR_AUTH_API_KEY_HEADER: ${CONNECTOR_AUTH_API_KEY_HEADER:-X-AIFABRIC-API-KEY}
    volumes:
      - connector_data:/app/data

  ai-fabric-runtime:
    build:
      context: ../../../..
      dockerfile: ai-infrastructure-module/ai-fabric-runtime/Dockerfile
    image: ai-fabric-runtime:local
    container_name: ai-fabric-runtime
    restart: unless-stopped
    depends_on:
      - connector
    ports:
      - "8097:8097"
    environment:
      PORT: 8097

      # LLM/embeddings provider (OpenAI is opt-in)
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-512}

      # CORS (for hosted UIs)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-}

      # Connector-backed actions
      ACTIONS_CONNECTOR_BASE_URL: ${ACTIONS_CONNECTOR_BASE_URL:-http://connector:8096}
      ACTIONS_CONNECTOR_API_KEY: ${ACTIONS_CONNECTOR_API_KEY:-}

    volumes:
      - ../runtime/config:/config:ro
      - runtime_data:/data
    command:
      - "--spring.config.additional-location=file:/config/"

volumes:
  runtime_data:
  connector_data:
