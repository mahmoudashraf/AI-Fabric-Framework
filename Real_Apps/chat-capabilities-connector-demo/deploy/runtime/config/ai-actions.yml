actions:
  - name: list_products
    description: List products by query (matches product title + category). Falls back to trending products.
    category: commerce
    accessMode: READ
    requiresConfirmation: false
    params:
      - name: query
        description: What products are you looking for?
        type: STRING
        required: true

  - name: search_products
    description: Search products by keyword (matches product title + category). Falls back to trending products.
    category: commerce
    accessMode: READ
    requiresConfirmation: false
    params:
      - name: query
        description: Search query
        type: STRING
        required: true

  - name: get_product_details
    description: Get full product details by SKU
    category: commerce
    accessMode: READ
    requiresConfirmation: false
    params:
      - name: sku
        description: Product SKU
        type: STRING
        required: true

  - name: view_cart
    description: View my current active cart and its items
    category: commerce
    accessMode: READ
    requiresConfirmation: false

  - name: add_to_cart
    description: Add one or more product SKUs to my active cart
    category: commerce
    accessMode: WRITE_ONLY
    requiresConfirmation: true
    confirmationMessage: Add items to your cart?
    params:
      - name: items
        description: Cart items to add
        type: ARRAY
        required: true
        batchTargets: true

  - name: remove_from_cart
    description: Remove a product SKU from my active cart
    category: commerce
    accessMode: WRITE_ONLY
    requiresConfirmation: true
    confirmationMessage: Remove {{sku}} from your cart?
    params:
      - name: sku
        description: Product SKU
        type: STRING
        required: true

  - name: apply_coupon_to_cart
    description: Apply a coupon code to my active cart
    category: commerce
    accessMode: WRITE_ONLY
    requiresConfirmation: true
    confirmationMessage: Apply coupon {{code}} to your cart?
    params:
      - name: code
        description: Coupon code
        type: STRING
        required: true

  - name: checkout_cart
    description: Checkout my active cart and create an order
    category: commerce
    accessMode: WRITE_ONLY
    requiresConfirmation: true
    confirmationMessage: Checkout your cart and place the order?
    params:
      - name: shippingAddress
        description: Shipping address
        type: STRING
        required: true
        sensitive: true
      - name: email
        description: Customer email
        type: STRING
        required: true
        sensitive: true
      - name: paymentMethod
        description: Payment method
        type: STRING
        required: false
        allowedValues: ["CARD", "PAYPAL", "COD"]

  - name: create_purchase_order
    description: Create a purchase order for a product SKU
    category: commerce
    accessMode: WRITE_ONLY
    requiresConfirmation: true
    confirmationMessage: Create purchase order for {{quantity}} × {{sku}}?
    params:
      - name: sku
        description: Product SKU
        type: STRING
        required: true
      - name: quantity
        description: Quantity
        type: INTEGER
        required: true
        min: 1
      - name: shippingAddress
        description: Shipping address
        type: STRING
        required: true
        sensitive: true
      - name: email
        description: Customer email
        type: STRING
        required: true
        pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
        sensitive: true

  - name: cancel_purchase_order
    description: Cancel an existing purchase order by order number (PO-...) or by order id
    category: commerce
    accessMode: WRITE_ONLY
    requiresConfirmation: true
    confirmationMessage: Cancel this order?
    params:
      - name: orderNumber
        description: Order number (PO-...)
        type: STRING
        required: false
      - name: orderId
        description: Order id (numeric)
        type: INTEGER
        required: false

  - name: list_orders
    description: List my purchase orders
    category: commerce
    accessMode: READ
    requiresConfirmation: false
    params:
      - name: limit
        description: Max number of orders to return
        type: INTEGER
        required: false
        min: 1
        max: 200

  - name: get_active_orders
    description: List my current active (not cancelled/fulfilled) purchase orders
    category: commerce
    accessMode: READ
    requiresConfirmation: false
    params:
      - name: limit
        description: Max number of orders to return
        type: INTEGER
        required: false
        min: 1
        max: 200

  - name: get_order_details
    description: Get purchase order details by order number (PO-...) or numeric id
    category: commerce
    accessMode: READ
    requiresConfirmation: false
    params:
      - name: orderNumberOrId
        description: Order number (PO-...) or numeric id
        type: STRING
        required: true

  - name: change_delivery_address
    description: Change the delivery (shipping) address for the current order (or a specific order number)
    category: commerce
    accessMode: WRITE_ONLY
    requiresConfirmation: true
    confirmationMessage: Change delivery address?
    params:
      - name: shippingAddress
        description: New shipping address
        type: STRING
        required: true
        sensitive: true
      - name: orderNumber
        description: Order number (PO-...)
        type: STRING
        required: false
      - name: orderId
        description: Order id (numeric)
        type: INTEGER
        required: false

  - name: offer_order_discount
    description: Offer a retention discount to keep an order active instead of cancelling it
    category: commerce
    accessMode: WRITE_ONLY
    requiresConfirmation: true
    confirmationMessage: Apply a {{discountPercent}}% discount to keep your order instead of cancelling?
    params:
      - name: orderNumber
        description: Order number (PO-...)
        type: STRING
        required: false
      - name: orderId
        description: Order id (numeric)
        type: INTEGER
        required: false
      - name: discountPercent
        description: Discount percent
        type: INTEGER
        required: false
        min: 1
        max: 90

  - name: list_my_addresses
    description: List my saved shipping/billing addresses
    category: commerce
    accessMode: READ
    requiresConfirmation: false
    params:
      - name: limit
        description: Max number of addresses to return
        type: INTEGER
        required: false
        min: 1
        max: 200

  - name: get_my_account
    description: Get my account/profile details
    category: commerce
    accessMode: READ
    requiresConfirmation: false

  - name: create_support_ticket
    description: Create a support ticket for an ecommerce issue
    category: support
    accessMode: WRITE_ONLY
    requiresConfirmation: true
    confirmationMessage: Create a support ticket?
    params:
      - name: issueType
        description: Issue type
        type: STRING
        required: true
      - name: description
        description: Issue description
        type: STRING
        required: true
        sensitive: true
      - name: orderNumber
        description: Order number or id
        type: STRING
        required: false

  - name: add_review
    description: Add a review for a product (this is searchable)
    category: commerce
    accessMode: WRITE_ONLY
    requiresConfirmation: true
    confirmationMessage: Submit this review?
    params:
      - name: productId
        description: Product id
        type: INTEGER
        required: false
      - name: sku
        description: Product sku
        type: STRING
        required: false
      - name: rating
        description: Rating 1-5
        type: INTEGER
        required: true
        min: 1
        max: 5
      - name: text
        description: Review text
        type: STRING
        required: true
        sensitive: true

  - name: track_shipment
    description: Track the latest shipment for an order (by order number or id)
    category: commerce
    accessMode: READ
    requiresConfirmation: false
    params:
      - name: orderNumber
        description: Order number (PO-...) or order id
        type: STRING
        required: true

  - name: create_return_request
    description: Create a return request (RMA) for an order (by order number or id)
    category: commerce
    accessMode: WRITE_ONLY
    requiresConfirmation: true
    confirmationMessage: Create a return request for this order?
    params:
      - name: orderNumber
        description: Order number (PO-...) or order id
        type: STRING
        required: true
      - name: reason
        description: Reason for return
        type: STRING
        required: true
        sensitive: true

