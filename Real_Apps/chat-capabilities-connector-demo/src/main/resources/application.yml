server:
  port: ${PORT:8096}
  forward-headers-strategy: framework

spring:
  application:
    name: chat-capabilities-connector-demo
  datasource:
    url: jdbc:h2:file:./data/chat-capabilities.db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.ai.fabric.realapps.chat: INFO

app:
  demo:
    seed-data: ${APP_DEMO_SEED_DATA:true}
  cors:
    # Example: CORS_ALLOWED_ORIGINS=https://ai-fabric.dev
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    # Example: CORS_ALLOWED_ORIGIN_PATTERNS=https://ai-fabric.dev,https://*.lovable.app
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}

connector:
  auth:
    api-key: ${CONNECTOR_AUTH_API_KEY:}
    api-key-header: ${CONNECTOR_AUTH_API_KEY_HEADER:X-AIFABRIC-API-KEY}
  admin:
    auth:
      enabled: ${CONNECTOR_ADMIN_AUTH_ENABLED:true}
  indexing:
    enabled: ${CONNECTOR_INDEXING_ENABLED:false}
    runtime-base-url: ${CONNECTOR_INDEXING_RUNTIME_BASE_URL:http://ai-fabric-runtime:8097}
    api-key: ${CONNECTOR_INDEXING_API_KEY:}
    api-key-header: ${CONNECTOR_INDEXING_API_KEY_HEADER:X-AIFABRIC-API-KEY}
