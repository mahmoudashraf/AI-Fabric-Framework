ai-entities:
  document:
    indexing:
      enabled: true
      max-characters: 8000
    analysis:
      enabled: false
      after: []
    searchable-fields:
      - name: content
        destinations: [SEMANTIC_SEARCH, RAG_CONTEXT]
        preprocessing: CLEAN
        priority: 100
        required: true
    metadata-fields:
      - name: tenantId
        data-type: ID
        destinations: [VECTOR_METADATA]
        priority: 100
        required: true
      - name: deploymentId
        data-type: ID
        destinations: [VECTOR_METADATA]
        priority: 90
        required: true
      - name: source
        data-type: STRING
        destinations: [VECTOR_METADATA, API_RESPONSE]
        priority: 80
      - name: sourceVersion
        data-type: STRING
        destinations: [VECTOR_METADATA, API_RESPONSE]
        priority: 70
